     IVC · Pantalla pública de consulta de trámite (INS-014 del flujo V4)

<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta de trámite IVC · Ministerio del Deporte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg, #f5f6fa);
      color: var(--text-primary, #282834);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header público ─────────────────────────────────────── */
    .public-header {
      background: var(--surface, #fff);
      border-bottom: 1px solid var(--border, #e7e9f3);
      flex-shrink: 0;
    }
    .public-header__inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .public-header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .public-header__logo {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent, #d74009), var(--naranja, #FF7500));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }
    .public-header__brand-text {
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .public-header__brand-name {
      font-size: 13px; font-weight: 700; color: var(--text-primary); line-height: 1.2;
    }
    .public-header__brand-sub {
      font-size: 11.5px; color: var(--text-secondary); line-height: 1.2; margin-top: 1px;
    }
    .public-header__title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    /* ── Main ───────────────────────────────────────────────── */
    .public-main {
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Disclaimer banner ──────────────────────────────────── */
    .public-disclaimer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--orange-bg, #fff3e6);
      border: 1px solid var(--orange-border, #ffbf75);
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--text-primary);
      margin: 0 0 28px;
      line-height: 1.4;
    }
    .public-disclaimer svg { flex-shrink: 0; color: #c97300; }

    /* ── Landing card (sin radicado) ────────────────────────── */
    .landing-card {
      max-width: 560px;
      margin: 64px auto 0;
      background: var(--surface, #fff);
      border-radius: var(--radius-xl, 20px);
      border: 1px solid var(--border, #e7e9f3);
      padding: 40px 36px;
      text-align: center;
      box-shadow: var(--shadow-card, 0 0 2px rgba(145,158,171,.2), 0 12px 24px -4px rgba(145,158,171,.12));
    }
    .landing-card__icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--orange-bg, #fff3e6);
      color: var(--accent, #d74009);
      display: flex; align-items: center; justify-content: center;
    }
    .landing-card h1 {
      font-size: 22px; font-weight: 700; margin: 0 0 8px;
      color: var(--text-primary);
    }
    .landing-card p {
      font-size: 14px; color: var(--text-secondary); line-height: 1.5;
      margin: 0 0 28px;
    }
    .landing-form {
      display: flex; gap: 8px; align-items: stretch;
    }
    .landing-form input {
      flex: 1;
      padding: 0 14px;
      height: 44px;
      border: 1px solid var(--border-dark, #d0d4e6);
      border-radius: var(--radius-md, 8px);
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-primary);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
    }
    .landing-form input::placeholder { font-weight: 400; letter-spacing: 0; color: var(--text-secondary); opacity: 0.6; }
    .landing-form input:focus {
      outline: none;
      border-color: var(--accent, #d74009);
      box-shadow: 0 0 0 3px rgba(215, 64, 9, 0.12);
    }
    .landing-card__hints {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .landing-card__hints strong { color: var(--text-primary); }
    .landing-card__sample {
      display: inline-block;
      font-family: ui-monospace, monospace;
      background: var(--bg-soft, #f5f6fa);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11.5px;
      color: var(--text-primary);
      margin: 0 4px;
    }

    /* ── Detalle del trámite encontrado ─────────────────────── */
    .tramite-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600;
      color: var(--accent, #d74009);
      text-decoration: none;
      margin: 0 0 16px;
      cursor: pointer;
    }
    .tramite-back:hover { text-decoration: underline; }

    .tramite-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl, 20px);
      padding: 28px 32px;
      margin: 0 0 24px;
      box-shadow: var(--shadow-card);
    }
    .tramite-hero__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .tramite-hero__radicado {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent, #d74009);
      letter-spacing: 0.3px;
      margin: 0 0 4px;
    }
    .tramite-hero__organismo {
      font-size: 22px; font-weight: 700; color: var(--text-primary);
      margin: 0 0 8px;
      line-height: 1.25;
    }
    .tramite-hero__meta {
      display: flex; gap: 24px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-secondary);
    }
    .tramite-hero__meta strong {
      color: var(--text-primary); font-weight: 600;
      margin-left: 4px;
    }
    .tramite-hero__plazo {
      flex-shrink: 0;
      text-align: right;
      min-width: 160px;
    }
    .tramite-hero__plazo-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
      text-transform: uppercase; color: var(--text-secondary);
      margin: 0 0 4px;
    }
    .tramite-hero__plazo-value {
      font-size: 28px; font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .tramite-hero__plazo-value--alert  { color: #c01818; }
    .tramite-hero__plazo-value--warn   { color: #c97300; }
    .tramite-hero__plazo-value--ok     { color: var(--green, #1f8923); }
    .tramite-hero__plazo-sub {
      font-size: 12px; color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Sections ───────────────────────────────────────────── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl, 20px);
      padding: 24px 32px 28px;
      margin: 0 0 20px;
      box-shadow: var(--shadow-card);
    }
    .section__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 20px;
    }
    .section__title {
      font-size: 11px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: #9a9db0;
      margin: 0;
    }

    /* ── .naowee-message margin scoped ──────────────────────── */
    .section .naowee-message {
      margin: 0 0 4px;
    }

    /* ── Veredicto subgrid (profesional + fecha + acta) ──── */
    .veredicto-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px 32px;
      margin: 24px 0 0;
    }
    @media (max-width: 720px) { .veredicto-grid { grid-template-columns: 1fr; } }
    .veredicto-grid__cell { display: flex; flex-direction: column; gap: 4px; }
    .veredicto-grid__label {
      font-size: 12px; font-weight: 500; color: var(--text-secondary);
    }

    /* ── Actor pill ──────────────────────────────────────────── */
    .actor-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .actor-pill__avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
    .actor-pill__name { font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
    .actor-pill__role { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

    /* ── File link minimal ──────────────────────────────────── */
    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      line-height: 1.3;
    }
    .file-link__size {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 400;
    }
    .file-link__download {
      color: var(--accent);
      transition: opacity .15s, transform .15s;
    }
    .file-link:hover .file-link__download {
      opacity: 0.7;
      transform: translateY(1px);
    }

    /* ── Lista de docs no cumplidos (subsanación) ──────────── */
    .docs-fail-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .docs-fail-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 8px);
      border-left: 3px solid #c01818;
      background: var(--surface);
    }
    .docs-fail-item--obs { border-left-color: var(--accent); }
    .docs-fail-item__num {
      flex-shrink: 0;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-soft);
      font-size: 11px; font-weight: 700;
      color: var(--text-secondary);
    }
    .docs-fail-item__body { flex: 1; min-width: 0; }
    .docs-fail-item__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .docs-fail-item__obs {
      font-size: 12.5px; color: var(--text-secondary);
      margin-top: 3px; line-height: 1.45;
      font-style: italic;
    }

    /* ── Histórico timeline ──────────────────────────────────── */
    .timeline { list-style: none; padding: 0; margin: 0; position: relative; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px; top: 12px; bottom: 12px;
      width: 2px;
      background: var(--border);
    }
    .timeline__item {
      position: relative;
      padding: 0 0 18px 28px;
    }
    .timeline__item:last-child { padding-bottom: 0; }
    .timeline__dot {
      position: absolute;
      left: 0; top: 6px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }
    .timeline__item--muted .timeline__dot {
      background: var(--border-dark);
    }
    .timeline__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); display: block; line-height: 1.3; }
    .timeline__meta  { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 3px; }

    /* ── CTA subsanar ─────────────────────────────────────── */
    .subsanar-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px dashed var(--accent);
      border-radius: var(--radius-xl, 20px);
      margin: 0 0 20px;
    }
    .subsanar-cta__text {
      font-size: 13.5px; color: var(--text-primary);
      line-height: 1.5; max-width: 640px;
    }
    .subsanar-cta__text strong { color: var(--accent); }

    /* ── Modal de subsanación ────────────────────────────────── */
    .subsanar-modal__doc-list {
      display: flex; flex-direction: column; gap: 10px;
      margin: 14px 0 18px;
    }
    .subsanar-doc-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 8px);
      background: var(--bg-soft);
    }
    .subsanar-doc-item__num {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11.5px; font-weight: 700;
      color: var(--text-secondary);
    }
    .subsanar-doc-item__body { flex: 1; min-width: 0; }
    .subsanar-doc-item__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .subsanar-doc-item__obs   { font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 10px; font-style: italic; }
    .subsanar-doc-item__upload {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px dashed var(--border-dark);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-secondary);
      transition: border-color .15s, color .15s;
    }
    .subsanar-doc-item__upload:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .subsanar-doc-item__upload.is-loaded {
      border-color: var(--green, #1f8923);
      color: var(--green);
      border-style: solid;
      background: var(--green-bg, #e6f4e7);
    }
    .subsanar-doc-item__upload input[type="file"] { display: none; }

    /* ── Footer ─────────────────────────────────────────────── */
    .public-footer {
      flex-shrink: 0;
      padding: 20px 24px 24px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .public-footer a { color: var(--accent); text-decoration: none; }
    .public-footer a:hover { text-decoration: underline; }

    /* ── Not found state ───────────────────────────────────── */
    .empty-not-found {
      max-width: 480px;
      margin: 64px auto 0;
      background: var(--surface);
      border-radius: var(--radius-xl, 20px);
      border: 1px solid var(--border);
      padding: 48px 36px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .empty-not-found__icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--bg-soft);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
    }
    .empty-not-found h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px; color: var(--text-primary); }
    .empty-not-found p  { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 24px; }
    .empty-not-found code {
      font-family: ui-monospace, monospace;
      background: var(--bg-soft);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text-primary);
    }
  </style>
</head>

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       INS-014 · Pantalla pública de consulta de trámite
       v1.8.4 · Sin login, lectura por radicado (riesgo conocido — INS-014).
       Cuando el organismo radica subsanación, llama a IVCStore.actualizarEstado
       que dispara el evento `tramite:estado-cambiado` cross-tab. El workspace
       del Profesional escucha ese evento y quita el lock automáticamente.
       ═══════════════════════════════════════════════════════════════════ */

    var ICON_SEARCH     = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
    var ICON_INFO       = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    var ICON_BACK       = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
    var ICON_DOWNLOAD   = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    var ICON_UPLOAD     = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
    var ICON_CHECK      = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var MSG_ICON_CHECK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var MSG_ICON_WARN   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    var MSG_ICON_X      = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function formatDate(iso) {
      if (!iso) return '—';
      var p = String(iso).split('-');
      if (p.length !== 3) return iso;
      var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return p[2] + ' ' + m[parseInt(p[1], 10) - 1] + ' ' + p[0];
    }
    function initials(name) {
      if (!name) return '?';
      return name.replace(/\([^)]*\)/g, '').trim().split(/\s+/).slice(0, 2)
        .map(function(p){ return p.charAt(0).toUpperCase(); }).join('');
    }

    /* ─── Boot ─────────────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', function () {
      IVCStore.init();
      window.IVCState = {
        rad: new URLSearchParams(location.search).get('rad'),
        tramite: null
      };
      route();

      /* Cross-tab sync: si el profesional cambia el estado mientras la pantalla
         está abierta (ej. nuevo veredicto post-subsanación), re-render. */
      IVCStore.on('store:changed-external', function () {
        if (!IVCState.rad) return;
        IVCState.tramite = IVCStore.getTramite(IVCState.rad);
        route();
      });
    });

    function route() {
      var host = document.getElementById('content');
      var rad = IVCState.rad;
      if (!rad) {
        renderLanding(host);
        return;
      }
      var t = IVCStore.getTramite(rad);
      IVCState.tramite = t;
      if (!t) {
        renderNotFound(host, rad);
      } else {
        renderTramite(host, t);
      }
    }

    /* ─── Landing (sin radicado en URL) ────────────────────────────────── */
    function renderLanding(host) {
      host.innerHTML =
        '<div class="landing-card">' +
          '<div class="landing-card__icon">' + ICON_SEARCH + '</div>' +
          '<h1>Consulte el estado de su trámite</h1>' +
          '<p>Ingrese el número de radicado para conocer el estado de su solicitud, descargar actos administrativos y, si aplica, radicar la subsanación.</p>' +
          '<form class="landing-form" onsubmit="return _onSubmitLanding(event)">' +
            '<input type="text" id="radInput" placeholder="IVC-2026-XXX" autocomplete="off" autocapitalize="characters">' +
            '<button type="submit" class="naowee-btn naowee-btn--accent" style="height:44px;">Consultar</button>' +
          '</form>' +
          '<div class="landing-card__hints">' +
            '<strong>Ejemplo de radicado:</strong>' +
            '<span class="landing-card__sample">IVC-2026-003</span>' +
            '<span class="landing-card__sample">IVC-2026-012</span>' +
            '<div style="margin-top:8px;">El número de radicado le fue entregado al momento de presentar su solicitud.</div>' +
          '</div>' +
        '</div>';
    }
    window._onSubmitLanding = function (ev) {
      ev.preventDefault();
      var val = (document.getElementById('radInput').value || '').trim().toUpperCase();
      if (!val) return false;
      location.search = '?rad=' + encodeURIComponent(val);
      return false;
    };

    /* ─── Not Found ────────────────────────────────────────────────────── */
    function renderNotFound(host, rad) {
      host.innerHTML =
        '<a class="tramite-back" onclick="_goLanding()">' + ICON_BACK + 'Nueva consulta</a>' +
        '<div class="empty-not-found">' +
          '<div class="empty-not-found__icon">' + ICON_SEARCH + '</div>' +
          '<h2>No encontramos el radicado</h2>' +
          '<p>No existe ningún trámite con el número <code>' + escHtml(rad) + '</code>. Verifique que esté escrito correctamente o consulte el documento que recibió al radicar.</p>' +
          '<button class="naowee-btn naowee-btn--outline" onclick="_goLanding()">Intentar de nuevo</button>' +
        '</div>';
    }
    window._goLanding = function () { location.search = ''; };

    /* ─── Trámite encontrado ──────────────────────────────────────────── */
    function renderTramite(host, t) {
      var orgLabel = ({ liga: 'Ligas o asociaciones deportivas', asociacion: 'Asociaciones juveniles o recreativas', federacion: 'Federaciones deportivas' })[t.tipoOrganismo] || t.tipoOrganismo;
      var plazo = (typeof t.plazoDias === 'number') ? t.plazoDias : 15;
      var plazoCls = plazo < 0 ? 'alert' : plazo <= 5 ? 'warn' : 'ok';
      var plazoTxt = plazo < 0 ? 'Vencido' : (plazo + ' días');
      var plazoSub = plazo < 0
        ? 'Hace ' + Math.abs(plazo) + ' días hábiles'
        : 'hábiles restantes';

      var isTerminal = (t.estado === 'Cumple' || t.estado === 'NoCumple' || t.estado === 'Parcial');
      var canSubsanar = (t.estado === 'NoCumple' || t.estado === 'Parcial');

      host.innerHTML =
        '<a class="tramite-back" onclick="_goLanding()">' + ICON_BACK + 'Nueva consulta</a>' +

        '<div class="public-disclaimer">' + ICON_INFO +
          '<div>Esta es una <strong>consulta pública por número de radicado</strong>. Próximamente activaremos verificación por correo electrónico (INS-014).</div>' +
        '</div>' +

        /* HERO */
        '<section class="tramite-hero">' +
          '<div class="tramite-hero__top">' +
            '<div>' +
              '<div class="tramite-hero__radicado">' + escHtml(t.id) + '</div>' +
              '<h1 class="tramite-hero__organismo">' + escHtml(t.organismo) + '</h1>' +
              '<div class="tramite-hero__meta">' +
                '<span>Tipo: <strong>' + escHtml(orgLabel) + '</strong></span>' +
                '<span>Trámite: <strong>' + escHtml(t.tipoTramite) + '</strong></span>' +
                '<span>Radicado: <strong>' + formatDate(t.fechaRadicacion) + '</strong></span>' +
              '</div>' +
            '</div>' +
            '<div class="tramite-hero__plazo">' +
              '<div class="tramite-hero__plazo-label">Plazo restante</div>' +
              '<div class="tramite-hero__plazo-value tramite-hero__plazo-value--' + plazoCls + '">' + plazoTxt + '</div>' +
              '<div class="tramite-hero__plazo-sub">' + plazoSub + '</div>' +
            '</div>' +
          '</div>' +
        '</section>' +

        /* RESULTADO (solo cuando hay veredicto) */
        (isTerminal ? renderResultado(t) : renderEnTramite(t)) +

        /* CTA SUBSANAR (solo NoCumple / Parcial) */
        (canSubsanar ? renderCTASubsanar() : '') +

        /* HISTÓRICO */
        renderHistorico(t);
    }

    /* ─── Resultado (cuando hay veredicto) ───────────────────────────── */
    function renderResultado(t) {
      var cfg = ({
        Cumple:   { variant: 'positive', icon: MSG_ICON_CHECK, title: 'CUMPLE',                desc: 'Su trámite fue aprobado. El acto administrativo de Otorgamiento está pendiente de firma por el Director IVC.', file: 'acto-otorgamiento-' + t.id + '.pdf' },
        Parcial:  { variant: 'caution',  icon: MSG_ICON_WARN,  title: 'CUMPLIMIENTO PARCIAL',  desc: 'Su trámite presenta observaciones que debe subsanar. Tiene 30 días hábiles desde la notificación para radicar la subsanación.', file: 'acto-cumplimiento-parcial-' + t.id + '.pdf' },
        NoCumple: { variant: 'negative', icon: MSG_ICON_X,     title: 'NO CUMPLE',             desc: 'Su trámite no cumple con los requisitos establecidos. Puede radicar una subsanación adjuntando los documentos faltantes o corregidos.',   file: 'acto-no-cumplimiento-' + t.id + '.pdf' }
      })[t.estado] || null;
      if (!cfg) return '';

      var evento = (t.historico || []).slice().reverse().find(function (h) {
        return (h.accion || '').indexOf(t.estado) >= 0;
      }) || {};
      var actorFull = evento.actor || 'Carlos Pérez (Profesional)';
      var actorName = actorFull.replace(/\s*\([^)]*\)\s*$/, '').trim();
      var actorRole = (actorFull.match(/\(([^)]*)\)/) || [, 'Profesional'])[1];

      /* Lista de docs no cumplidos (sólo si NoCumple/Parcial) */
      var docs = Array.isArray(t.documentos) ? t.documentos : [];
      var docsFail = docs.filter(function (d) { return d.validacion === 'no' || d.validacion === 'obs'; });
      var docsFailHtml = '';
      if (docsFail.length > 0) {
        docsFailHtml =
          '<div style="margin-top: 28px;">' +
            '<h3 class="section__title" style="margin-bottom: 14px;">Documentos a subsanar</h3>' +
            '<div class="docs-fail-list">' +
              docsFail.map(function (d, i) {
                var isObs = d.validacion === 'obs';
                return '<div class="docs-fail-item' + (isObs ? ' docs-fail-item--obs' : '') + '">' +
                  '<div class="docs-fail-item__num">' + (d.orden || (i + 1)) + '</div>' +
                  '<div class="docs-fail-item__body">' +
                    '<div class="docs-fail-item__title">' + escHtml(d.titulo) + '</div>' +
                    (d.observacion ? '<div class="docs-fail-item__obs">' + escHtml(d.observacion) + '</div>' : '') +
                  '</div>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>';
      }

      return '<section class="section">' +
        '<div class="section__header"><h3 class="section__title">Resultado de la validación</h3></div>' +

        /* .naowee-message canónico DS */
        '<div class="naowee-message naowee-message--' + cfg.variant + '">' +
          '<div class="naowee-message__header">' +
            '<div class="naowee-message__icon">' + cfg.icon + '</div>' +
            '<div class="naowee-message__title">' + cfg.title + '</div>' +
          '</div>' +
          '<div class="naowee-message__text">' + escHtml(cfg.desc) + '</div>' +
        '</div>' +

        /* Grid: profesional + fecha + acta */
        '<div class="veredicto-grid">' +
          '<div class="veredicto-grid__cell">' +
            '<span class="veredicto-grid__label">Profesional encargado</span>' +
            '<div class="actor-pill">' +
              '<div class="actor-pill__avatar">' + initials(actorName) + '</div>' +
              '<div>' +
                '<div class="actor-pill__name">' + escHtml(actorName) + '</div>' +
                '<div class="actor-pill__role">' + escHtml(actorRole) + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="veredicto-grid__cell">' +
            '<span class="veredicto-grid__label">Fecha del veredicto</span>' +
            '<span style="font-size:14px; font-weight:500;">' + (evento.fecha ? formatDate(evento.fecha) + (evento.hora ? ' · ' + evento.hora : '') : '—') + '</span>' +
          '</div>' +
          '<div class="veredicto-grid__cell">' +
            '<span class="veredicto-grid__label">Acto administrativo</span>' +
            '<a href="#" class="file-link" title="Descargar" onclick="event.preventDefault(); _mockDownload(\'' + cfg.file + '\');">' +
              '<span>' + escHtml(cfg.file) + '</span>' +
              '<span class="file-link__size">312 KB · PDF</span>' +
              '<span class="file-link__download">' + ICON_DOWNLOAD + '</span>' +
            '</a>' +
          '</div>' +
        '</div>' +

        docsFailHtml +
      '</section>';
    }

    /* ─── En trámite (sin veredicto aún) ─────────────────────────────── */
    function renderEnTramite(t) {
      var msg = ({
        'No asignada':   { variant: 'informative', title: 'EN REMISIÓN',    desc: 'Su trámite fue recibido y está pendiente de ser asignado a un profesional IVC.' },
        'Asignada':      { variant: 'informative', title: 'EN ASIGNACIÓN', desc: 'Su trámite ya fue asignado a un profesional. Pronto iniciará la revisión.' },
        'En validación': { variant: 'caution',     title: 'EN VALIDACIÓN', desc: 'Un profesional del IVC está revisando la documentación de su trámite.' }
      })[t.estado] || { variant: 'informative', title: t.estado, desc: 'Su trámite se encuentra en proceso.' };

      var msgIcon = msg.variant === 'caution' ? MSG_ICON_WARN : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

      return '<section class="section">' +
        '<div class="section__header"><h3 class="section__title">Estado actual</h3></div>' +
        '<div class="naowee-message naowee-message--' + msg.variant + '">' +
          '<div class="naowee-message__header">' +
            '<div class="naowee-message__icon">' + msgIcon + '</div>' +
            '<div class="naowee-message__title">' + msg.title + '</div>' +
          '</div>' +
          '<div class="naowee-message__text">' + escHtml(msg.desc) + '</div>' +
        '</div>' +
      '</section>';
    }

    /* ─── CTA de subsanación ────────────────────────────────────────── */
    function renderCTASubsanar() {
      return '<div class="subsanar-cta">' +
        '<div class="subsanar-cta__text">' +
          '<strong>¿Listo para subsanar?</strong> Cargue los documentos corregidos y radique la subsanación. Su trámite volverá automáticamente a validación.' +
        '</div>' +
        '<button class="naowee-btn naowee-btn--accent" onclick="_openSubsanarModal()" style="flex-shrink:0;">Radicar subsanación</button>' +
      '</div>';
    }

    /* ─── Histórico timeline ─────────────────────────────────────────── */
    function renderHistorico(t) {
      var events = (t.historico || []).slice().reverse();
      if (events.length === 0) return '';
      return '<section class="section">' +
        '<div class="section__header"><h3 class="section__title">Histórico del trámite</h3></div>' +
        '<ul class="timeline">' +
          events.map(function (e, i) {
            var muted = i === 0 ? '' : ' timeline__item--muted';
            var meta = (e.fecha ? formatDate(e.fecha) : '') + (e.hora ? ' · ' + e.hora : '') + (e.actor ? ' · ' + e.actor : '');
            return '<li class="timeline__item' + muted + '">' +
              '<span class="timeline__dot"></span>' +
              '<span class="timeline__title">' + escHtml(e.accion || 'Evento') + '</span>' +
              (meta ? '<span class="timeline__meta">' + escHtml(meta) + '</span>' : '') +
            '</li>';
          }).join('') +
        '</ul>' +
      '</section>';
    }

    /* ─── Modal de subsanación ──────────────────────────────────────── */
    window._openSubsanarModal = function () {
      var t = IVCState.tramite;
      if (!t) return;
      var docs = (Array.isArray(t.documentos) ? t.documentos : []).filter(function (d) {
        return d.validacion === 'no' || d.validacion === 'obs';
      });
      /* Si no hay docs marcados, mostrar mensaje genérico */
      if (docs.length === 0) {
        docs = [{ id: 'general', orden: 1, titulo: 'Documentación corregida', observacion: 'Adjunte los documentos solicitados en el acto administrativo.' }];
      }

      var overlay = document.createElement('div');
      overlay.className = 'naowee-modal-overlay open';
      overlay.id = 'subsanarOverlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML =
        '<div class="naowee-modal" style="width:95vw; max-width: 720px; display:flex; flex-direction:column; max-height: 88vh;">' +
          '<div class="naowee-modal__header" style="flex-shrink:0;">' +
            '<div class="naowee-modal__title-group">' +
              '<h2 class="naowee-modal__title">Radicar subsanación</h2>' +
              '<p class="naowee-modal__subtitle">' + escHtml(t.id) + ' · ' + escHtml(t.organismo) + '</p>' +
            '</div>' +
            '<button type="button" class="naowee-modal__dismiss" onclick="_closeSubsanarModal()" aria-label="Cerrar">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="naowee-modal__body" style="flex: 1 1 auto; overflow-y:auto; padding: 20px 28px;">' +
            '<div class="naowee-message naowee-message--informative" style="margin-bottom: 18px;">' +
              '<div class="naowee-message__header">' +
                '<div class="naowee-message__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
                '<div class="naowee-message__title">Documentos por corregir</div>' +
              '</div>' +
              '<div class="naowee-message__text">Adjunte la versión corregida de cada documento. Al radicar, su trámite volverá a revisión.</div>' +
            '</div>' +
            '<div class="subsanar-modal__doc-list">' +
              docs.map(function (d, i) {
                return '<div class="subsanar-doc-item" data-doc-id="' + escHtml(d.id) + '">' +
                  '<div class="subsanar-doc-item__num">' + (d.orden || (i + 1)) + '</div>' +
                  '<div class="subsanar-doc-item__body">' +
                    '<div class="subsanar-doc-item__title">' + escHtml(d.titulo) + '</div>' +
                    (d.observacion ? '<div class="subsanar-doc-item__obs">' + escHtml(d.observacion) + '</div>' : '') +
                    '<label class="subsanar-doc-item__upload" for="file-' + escHtml(d.id) + '">' +
                      '<span class="ico-upload" style="display:flex;">' + ICON_UPLOAD + '</span>' +
                      '<span class="upload-label">Cargar documento corregido (PDF · máx. 10 MB)</span>' +
                      '<input type="file" id="file-' + escHtml(d.id) + '" accept=".pdf" onchange="_onUploadChange(this)" />' +
                    '</label>' +
                  '</div>' +
                '</div>';
              }).join('') +
            '</div>' +
            '<div style="margin-top: 18px;">' +
              '<label style="display:block; font-size:12.5px; font-weight:600; color: var(--text-secondary); margin-bottom: 6px;">Comentarios adicionales (opcional)</label>' +
              '<textarea id="subsanarObs" placeholder="Describa brevemente los cambios realizados…" style="width:100%; min-height: 80px; padding: 10px 12px; border: 1px solid var(--border-dark); border-radius: 8px; font-family: inherit; font-size: 13px; resize: vertical;"></textarea>' +
            '</div>' +
          '</div>' +
          '<div class="naowee-modal__footer" style="flex-shrink:0; padding: 16px 28px; border-top: 1px solid var(--border); display:flex; justify-content:flex-end; gap: 10px;">' +
            '<button class="naowee-btn naowee-btn--outline" onclick="_closeSubsanarModal()">Cancelar</button>' +
            '<button class="naowee-btn naowee-btn--accent" onclick="_confirmSubsanacion()">Radicar subsanación</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    };
    window._closeSubsanarModal = function () {
      var el = document.getElementById('subsanarOverlay');
      if (el) el.remove();
    };
    window._onUploadChange = function (input) {
      var file = input.files && input.files[0];
      if (!file) return;
      var label = input.closest('.subsanar-doc-item__upload');
      if (!label) return;
      label.classList.add('is-loaded');
      var ico = label.querySelector('.ico-upload');
      if (ico) ico.innerHTML = ICON_CHECK;
      var txt = label.querySelector('.upload-label');
      if (txt) txt.textContent = file.name + ' · cargado';
    };
    window._confirmSubsanacion = function () {
      var t = IVCState.tramite;
      if (!t) return;
      var obs = (document.getElementById('subsanarObs') || {}).value || '';

      /* Mock: en lugar de subir archivos a un backend, sólo actualizamos
         el estado a "En validación" y registramos en el histórico. */
      var actorOrg = t.organismo + ' (Organismo)';
      var detalle = 'Subsanación radicada por el organismo' + (obs ? ' · ' + obs : '');
      IVCStore.actualizarEstado(t.id, 'En validación', actorOrg, detalle);

      _closeSubsanarModal();
      _showToast('Subsanación radicada. Su trámite vuelve a revisión.');

      /* Re-render con el nuevo estado */
      setTimeout(function () {
        IVCState.tramite = IVCStore.getTramite(t.id);
        route();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 200);
    };

    /* ─── Helpers ──────────────────────────────────────────────────── */
    window._mockDownload = function (filename) {
      _showToast('Descargando ' + filename + ' (mock)');
    };
    function _showToast(msg) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#282834; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:500; z-index:9999; box-shadow:0 4px 12px rgba(0,0,0,.2);';
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2600);
    }
  </script>
</body>
</html>
