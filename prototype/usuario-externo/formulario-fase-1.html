<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IVC · Radicación · Fase 1 (Demo) — Naowee</title>

<!-- Fuente Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Naowee Design System v1.8.0 canónico -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naowee-tech/naowee-design-system@v1.8.0/dist/design-system.css">

<style>
  /* ============================================================
     CSS scoped al módulo IVC — solo tokens locales para layout
     y patrón wizard-page (no override de clases .naowee-*).
     ============================================================ */
  :root {
    --accent: var(--naowee-color-feedback-fill-caution-loud, #d74009);
    --orange-bg: #fff3e6;
    --text-primary: var(--naowee-color-text-primary, #282834);
    --text-secondary: var(--naowee-color-text-secondary, #646587);
    --border: var(--naowee-color-border-mute, #e7e9f3);
    --border-dark: var(--naowee-color-border-default, #d0d4e6);
    --header-h: 72px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f6fa;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }

  /* ============================================================
     HEADER · estilo v2.0.3 (Ministerio + Naowee + SUID)
     ============================================================ */
  .ivc-top-header {
    height: var(--header-h);
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 90;
  }
  .ivc-top-header__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-right: auto;
  }
  .ivc-top-header__logos {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ivc-top-header__logos img.l-min { height: 38px; width: auto; display: block; }
  .ivc-top-header__logos img.l-suid { height: 28px; width: auto; display: block; }
  .ivc-top-header__logos img.l-naowee { height: 22px; width: auto; display: block; opacity: .9; }
  .ivc-top-header__sep {
    width: 1px; height: 28px; background: var(--border);
  }
  .ivc-top-header__title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .ivc-top-header__subtitle {
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .ivc-top-header__meta {
    display: flex; align-items: center; gap: 12px;
  }
  @media (max-width: 760px) {
    .ivc-top-header { padding: 0 16px; }
    .ivc-top-header__logos img.l-naowee,
    .ivc-top-header__sep { display: none; }
    .ivc-top-header__title-wrap { display: none; }
  }

  /* ============================================================
     WIZARD-PAGE pattern (espejo de v2.0.3/shared/wizard-page.css)
     ============================================================ */
  .wz-page {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .wz-page__header { margin-bottom: 18px; }
  .wz-page__title {
    margin: 8px 0 4px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text-primary);
    line-height: 1.15;
  }
  .wz-page__subtitle {
    color: var(--text-secondary);
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .wz-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
      0 0 2px rgba(145,158,171,.2),
      0 12px 24px -4px rgba(145,158,171,.12);
    overflow: hidden;
  }

  /* Stepper wrapper (usa .naowee-stepper canónico) */
  .wz-stepper-wrap {
    padding: 18px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    background: #fff;
  }
  .wz-stepper-wrap .naowee-stepper {
    width: 100%;
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    padding: 0;
    background: transparent;
    border-bottom: 0;
    overflow-x: auto;
  }
  .wz-stepper-wrap .naowee-stepper__step {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    flex-shrink: 0;
    cursor: default;
  }
  .wz-stepper-wrap .naowee-stepper__number {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700;
    flex-shrink: 0;
    background: #f5f6fa;
    color: var(--text-secondary);
    transition: all .2s;
  }
  .wz-stepper-wrap .naowee-stepper__label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color .2s;
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__number {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(215,64,9,.12);
  }
  .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
    animation: wzStepperPulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  @keyframes wzStepperPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(215, 64, 9, .45); }
    50%      { box-shadow: 0 0 0 8px rgba(215, 64, 9, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
      animation: none;
    }
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__label {
    color: var(--text-primary);
    font-weight: 600;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__number {
    background: #15803d; color: #fff;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__label {
    color: var(--text-primary);
  }
  .wz-stepper-wrap .naowee-stepper__step--done { cursor: pointer; }
  .wz-stepper-wrap .naowee-stepper__step--done:hover .naowee-stepper__label { color: var(--accent); }
  .wz-stepper-wrap .naowee-stepper__connector {
    flex: 1 1 auto;
    height: 2px;
    background: var(--border);
    margin: 0 6px;
    border-radius: 1px;
    min-width: 12px;
  }
  .wz-stepper-wrap .naowee-stepper__connector--done { background: #15803d; }

  .wz-stepper-mobile {
    display: none;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .wz-stepper-mobile small {
    display: block;
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }
  @media (max-width: 760px) {
    .wz-stepper-wrap { display: none; }
    .wz-stepper-mobile { display: block; }
  }

  /* Body wizard */
  .wz-body { padding: 24px 28px; }
  .wz-step-panel { display: none; animation: wzStepFadeIn .3s cubic-bezier(.32,.72,0,1) both; }
  .wz-step-panel.is-active { display: block; }
  @keyframes wzStepFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .wz-section {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #b5b9d4;
    margin: 22px 0 12px;
  }
  .wz-section:first-child { margin-top: 0; }
  .wz-grid-2 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  .wz-grid-3 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .wz-grid-2, .wz-grid-3 { grid-template-columns: 1fr; }
  }
  .wz-step-panel > .naowee-textfield,
  .wz-step-panel > .naowee-dropdown { margin-bottom: 18px; }
  .wz-grid-2 > .naowee-textfield,
  .wz-grid-2 > .naowee-dropdown,
  .wz-grid-3 > .naowee-textfield,
  .wz-grid-3 > .naowee-dropdown { margin-bottom: 0; }

  /* Footer wizard */
  .wz-footer {
    padding: 18px 28px;
    border-top: 1px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
  .wz-footer__prefix { margin-right: auto; }
  .wz-save-draft {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; border: 0;
    height: 46px; padding: 0 18px;
    color: var(--accent);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    transition: background .15s, transform .12s;
    white-space: nowrap;
  }
  .wz-save-draft:hover { background: var(--orange-bg); }
  .wz-save-draft:active { transform: scale(.97); }

  /* File drop (canónico v2.0.3) */
  .wz-file-drop {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    padding: 24px 18px;
    border: 1.5px dashed var(--border-dark);
    border-radius: 12px;
    background: #fafbff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .wz-file-drop:hover { border-color: var(--accent); background: #fff8f4; }
  .wz-file-drop.is-filled {
    border-style: solid;
    border-color: #15803d;
    background: #f0faf2;
  }
  .wz-file-drop__icon { color: var(--text-secondary); }
  .wz-file-drop.is-filled .wz-file-drop__icon { color: #15803d; }
  .wz-file-drop__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  .wz-file-drop__hint { font-size: 12px; color: var(--text-secondary); text-align: center; }
  .wz-file-drop__name { font-size: 12.5px; font-weight: 600; color: #15803d; margin-top: 4px; }
  .wz-file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* Cards de documento (lista de cargas paso 6) */
  .ivc-doc-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fff;
    margin-bottom: 14px;
  }
  .ivc-doc-card__head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .ivc-doc-card__title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    margin: 0;
  }
  .ivc-doc-card__desc {
    font-size: 12.5px; color: var(--text-secondary);
    margin: 2px 0 0;
  }

  /* Tablas repeatable */
  .ivc-repeatable {
    border: 1px solid var(--border);
    border-radius: 12px;
    /* overflow visible para que el .naowee-dropdown__menu pueda
       desbordar la fila sin ser clipped por el contenedor */
    overflow: visible;
    background: #fff;
  }
  /* Dropdown inline en filas repetibles: ancho 100%, mismo look que ivc-mini-input.
     `.ivc-dropdown--inline` es scope custom IVC, NO del DS canónico (el DS solo define
     .naowee-dropdown sin variante --inline). Lo usamos junto a .naowee-dropdown. */
  .ivc-repeatable__row .ivc-dropdown--inline { width: 100%; }
  .ivc-repeatable__row .ivc-dropdown--inline .naowee-dropdown__menu {
    /* Permite el menú flotante por encima de filas siguientes */
    z-index: 1000;
  }
  .ivc-repeatable__head,
  .ivc-repeatable__row {
    display: grid;
    gap: 10px;
    padding: 12px 14px;
    align-items: center;
  }
  .ivc-repeatable__head {
    background: #fafbff;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .ivc-repeatable__row + .ivc-repeatable__row { border-top: 1px dashed var(--border); }
  .ivc-repeatable__row input.ivc-mini-input,
  .ivc-repeatable__row select.ivc-mini-input {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .ivc-repeatable__row input.ivc-mini-input:focus,
  .ivc-repeatable__row select.ivc-mini-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(215,64,9,.15);
  }
  .ivc-repeatable__row-display {
    font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  }
  .ivc-repeatable__remove {
    background: transparent;
    border: 0;
    color: var(--text-secondary);
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .ivc-repeatable__remove:hover { background: #fff0ee; color: #C00000; }
  .ivc-repeatable__remove[disabled] { opacity: .35; cursor: not-allowed; }
  .ivc-repeatable__add {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #fafbff;
    text-align: center;
  }

  /* Resumen final (paso 7) */
  .wz-review { display: grid; gap: 14px; }
  .wz-review__group {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fbfbfd;
  }
  .wz-review__group-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .wz-review__row {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 12px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
  .wz-review__row:last-child { border-bottom: 0; }
  .wz-review__label { color: var(--text-secondary); font-weight: 500; }
  .wz-review__value { color: var(--text-primary); font-weight: 600; word-break: break-word; }
  @media (max-width: 640px) {
    .wz-review__row { grid-template-columns: 1fr; gap: 2px; }
  }

  /* Success view (radicación completada) */
  .wz-success {
    position: relative;
    text-align: center;
    padding: 56px 32px;
    overflow: hidden;
  }
  .wz-success__check {
    width: 88px; height: 88px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: #15803d; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(21,128,61,.12);
    animation: wzCheckPop .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes wzCheckPop {
    from { transform: scale(.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .wz-success h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: var(--text-primary); }
  .wz-success p { margin: 0 auto 14px; max-width: 480px; font-size: 14px; color: var(--text-secondary); }
  .wz-success__radicado {
    display: inline-block; margin: 4px 0 18px;
    padding: 10px 18px;
    background: var(--orange-bg);
    border: 1px solid #ffbf75;
    border-radius: 8px;
    font-family: 'JetBrains Mono', 'Menlo', monospace;
    font-size: 18px; font-weight: 700;
    color: var(--accent);
    letter-spacing: .5px;
  }

  /* Skip view (paso no aplica para asociaciones) */
  .ivc-skip-view { padding: 48px 32px; text-align: center; }
  .ivc-skip-view svg { color: var(--text-secondary); margin-bottom: 12px; }
  .ivc-skip-view h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .ivc-skip-view p { color: var(--text-secondary); font-size: 13.5px; margin: 0; }

  /* Counter para textarea */
  .ivc-counter {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    text-align: right;
  }

  /* Spacing default para .naowee-message embebido */
  .wz-step-panel > .naowee-message { margin-bottom: 18px; }

</style>
</head>

<body>

<!-- ============================================================
     HEADER · Ministerio + SUID + Naowee
     ============================================================ -->
<header class="ivc-top-header">
  <div class="ivc-top-header__brand">
    <div class="ivc-top-header__logos">
      <img class="l-min" src="logos/ministerio.svg" alt="Ministerio del Deporte" onerror="this.style.display='none'"/>
      <div class="ivc-top-header__sep"></div>
      <img class="l-suid" src="logos/suid.png" alt="SUID — Sistema Único de Información del Deporte" onerror="this.style.display='none'"/>
    </div>
    <div class="ivc-top-header__title-wrap">
      <div class="ivc-top-header__title">Trámite IVC · Reconocimiento Deportivo</div>
      <div class="ivc-top-header__subtitle">Inspección, Vigilancia y Control</div>
    </div>
    <span class="naowee-badge naowee-badge--brand naowee-badge--quiet naowee-badge--small">Demo · Fase 1</span>
  </div>
  <div class="ivc-top-header__meta">
    <img class="l-naowee" src="logos/naowee.svg" alt="Naowee" onerror="this.style.display='none'"/>
  </div>
</header>

<!-- ============================================================
     PAGE
     ============================================================ -->
<main class="wz-page">

  <div class="wz-page__header">
    <h1 class="wz-page__title">Radicación de trámite</h1>
    <p class="wz-page__subtitle">Otorgamiento de Reconocimiento Deportivo · Completa los pasos siguientes para radicar tu solicitud.</p>
  </div>

  <article class="wz-card">

    <!-- Stepper desktop -->
    <div class="wz-stepper-wrap" id="stepperWrap">
      <div class="naowee-stepper naowee-stepper--pulse" id="stepperDesktop" role="list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Stepper mobile -->
    <div class="wz-stepper-mobile" id="stepperMobile"></div>

    <!-- Body -->
    <div class="wz-body" id="wzBody"></div>

    <!-- Footer -->
    <div class="wz-footer">
      <div class="wz-footer__prefix">
        <button type="button" class="wz-save-draft" id="btnDraft" title="Guardar borrador">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar borrador
        </button>
      </div>
      <button type="button" class="naowee-btn naowee-btn--quiet naowee-btn--large" id="btnBack">← Anterior</button>
      <button type="button" class="naowee-btn naowee-btn--loud naowee-btn--large" id="btnNext">Continuar →</button>
    </div>

  </article>
</main>

<script>
/* ============================================================
   IVC Demo Fase 1 — JS de orquestación
   ============================================================ */

const STEPS = [
  { label: 'Pre-selección', short: 'Pre-selección' },
  { label: 'Datos generales', short: 'Datos generales' },
  { label: 'Personería', short: 'Personería' },
  { label: 'Asamblea', short: 'Asamblea' },
  { label: 'Estructura', short: 'Estructura' },
  { label: 'Documentos', short: 'Documentos' },
  { label: 'Confirmación', short: 'Confirmación' }
];

const MUNICIPIOS = [
  { v:'', t:'Selecciona un municipio…' },
  { v:'bogota', t:'Bogotá D.C.' },
  { v:'medellin', t:'Medellín' },
  { v:'cali', t:'Cali' },
  { v:'cartagena', t:'Cartagena' },
  { v:'barranquilla', t:'Barranquilla' },
  { v:'bucaramanga', t:'Bucaramanga' },
  { v:'manizales', t:'Manizales' }
];

const STATE = {
  step: 0,
  tipoOrganismo: '',
  tipoTramite: 'otorgamiento',
  data: {
    nombre: 'Liga de Atletismo de Antioquia',
    nit: '800123456-7',
    direccion: '',
    municipio: '',
    telefono: '',
    correo: '',

/* ============================================================
   Helpers
   ============================================================ */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function dispValue(v) { return v && String(v).trim() ? esc(v) : '<span style="color:var(--text-secondary);font-style:italic">(no diligenciado)</span>'; }

function isStepApplicable(idx) {
  if (idx === 3 && STATE.tipoOrganismo === 'asociacion') return false;
  return true;
}

function fileSizeFmt(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

function getStateAtPath(path) {
  const parts = path.split('.');
  let cur = STATE;
  for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
  return cur;
}
function setStateAtPath(path, val) {
  const parts = path.split('.');
  let cur = STATE;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function clearStateAtPath(path) { setStateAtPath(path, null); }

function mockUpload(input, statePath) {
  const f = input.files && input.files[0];
  if (!f) return;
  setStateAtPath(statePath, { name: f.name, size: fileSizeFmt(f.size) });
  render();
}

// Dropdown — componente canónico .naowee-dropdown del DS Naowee v1.8.0
// El JS controlador está al final del archivo (initDropdowns)
function dd(opts) {
  const id = opts.id || ('dd-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const options = opts.options || [];
  // onChange recibe el valor seleccionado. Se invoca desde el controlador
  // simulando un input con .value (compatibilidad con strings tipo "STATE.x=this.value")
  const onChange = opts.onChange || '';
  // Encuentra placeholder (option con v='') y opción seleccionada
  const placeholderOpt = options.find(o => o.v === '');
  const placeholderText = placeholderOpt ? placeholderOpt.t : 'Selecciona…';
  const selectedOpt = options.find(o => o.v === value && o.v !== '');
  const hasValue = !!selectedOpt;
  // Filtra placeholder fuera del menú visible (DS usa el placeholder en el trigger, no como opción)
  const menuOptions = options.filter(o => o.v !== '');
  return `
    <div class="naowee-dropdown" id="${id}-wrap" data-dd-id="${id}"${required ? ' data-required="true"' : ''} data-on-change="${escAttr(onChange)}">
      <label class="naowee-dropdown__label${required ? ' naowee-dropdown__label--required' : ''}">${esc(label)}</label>
      <button type="button" id="${id}" class="naowee-dropdown__trigger" aria-haspopup="listbox" aria-expanded="false">
        ${hasValue
          ? `<span class="naowee-dropdown__value">${esc(selectedOpt.t)}</span>`
          : `<span class="naowee-dropdown__placeholder">${esc(placeholderText)}</span>`}
        <div class="naowee-dropdown__controls">
          <span class="naowee-dropdown__chevron">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
          </span>
        </div>
      </button>
      <div class="naowee-dropdown__menu" role="listbox" data-placeholder="${escAttr(placeholderText)}">
        ${menuOptions.map(o => `<div class="naowee-dropdown__option${o.v === value ? ' naowee-dropdown__option--selected' : ''}" role="option" data-value="${escAttr(o.v)}" tabindex="-1">${esc(o.t)}</div>`).join('')}
      </div>
    </div>
  `;
}

/* ============================================================
   Stepper
   ============================================================ */
function renderStepper() {
  const wrap = document.getElementById('stepperDesktop');
  let html = '';
  STEPS.forEach((s, i) => {
    let stateCls = '';
    if (i < STATE.step) stateCls = 'naowee-stepper__step--done';
    else if (i === STATE.step) stateCls = 'naowee-stepper__step--active';

    const numberHtml = i < STATE.step
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : (i + 1);

    html += `
      <div class="naowee-stepper__step ${stateCls}" role="listitem"${i < STATE.step ? ` onclick="STATE.step=${i};render();"` : ''}>
        <span class="naowee-stepper__number">${numberHtml}</span>
        <span class="naowee-stepper__label">${esc(s.label)}</span>
      </div>
    `;
    if (i < STEPS.length - 1) {
      html += `<div class="naowee-stepper__connector${i < STATE.step ? ' naowee-stepper__connector--done' : ''}"></div>`;
    }
  });
  wrap.innerHTML = html;

  document.getElementById('stepperMobile').innerHTML = `
    Paso ${STATE.step + 1} de ${STEPS.length}
    <small>${esc(STEPS[STATE.step].label)}</small>
  `;
}

function repeatableDynamic(opts) {
  const head = opts.head;
  const cols = opts.cols;
  const rows = opts.rows;
  const cellRenderer = opts.cellRenderer;
  const onAdd = opts.onAdd;
  const onRemove = opts.onRemove;
  const minRows = opts.minRows ?? 1;
  return `
    <div class="ivc-repeatable">
      <div class="ivc-repeatable__head" style="grid-template-columns: ${cols};">
        ${head.map(h => `<div>${esc(h)}</div>`).join('')}
        <div></div>
      </div>
      ${rows.map((row, i) => `
        <div class="ivc-repeatable__row" style="grid-template-columns: ${cols};">
          ${cellRenderer(row, i)}
          <button type="button" class="ivc-repeatable__remove"${rows.length <= minRows ? ' disabled' : ` onclick="${onRemove(i)}"`} aria-label="Eliminar fila">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      `).join('')}
      <div class="ivc-repeatable__add">
        <button type="button" class="naowee-btn naowee-btn--quiet naowee-btn--small" onclick="${onAdd}">+ Agregar fila</button>
      </div>
    </div>
  `;
}

function repeatableFixed(opts) {
  const head = opts.head;
  const cols = opts.cols;
  const rows = opts.rows;
  const cellRenderer = opts.cellRenderer;
  return `
    <div class="ivc-repeatable">
      <div class="ivc-repeatable__head" style="grid-template-columns: ${cols};">
        ${head.map(h => `<div>${esc(h)}</div>`).join('')}
      </div>
      ${rows.map((row, i) => `
        <div class="ivc-repeatable__row" style="grid-template-columns: ${cols};">
          ${cellRenderer(row, i)}
        </div>
      `).join('')}
    </div>
  `;
}

      </div>

/* ============================================================
   Render principal
   ============================================================ */
function render() {
  renderStepper();
  const body = document.getElementById('wzBody');

  if (!isStepApplicable(STATE.step)) {
    body.innerHTML = `<div class="wz-step-panel is-active">${renderSkipView('Este paso no aplica para tu tipo de organismo.')}</div>`;
    setupFooter();
    return;
  }

  let inner = '';
  switch (STATE.step) {
    case 0: inner = renderStep0(); break;
    case 1: inner = renderStep1(); break;
    case 2: inner = renderStep2(); break;
    case 3: inner = renderStep3(); break;
    case 4: inner = renderStep4(); break;
    case 5: inner = renderStep5(); break;
    case 6: inner = renderStep6(); break;
  }
  body.innerHTML = `<div class="wz-step-panel is-active">${inner}</div>`;

  setupFooter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupFooter() {
  const btnBack = document.getElementById('btnBack');
  const btnNext = document.getElementById('btnNext');
  const btnDraft = document.getElementById('btnDraft');

  if (STATE.radicado) {
    btnBack.style.display = 'none';
    btnNext.style.display = 'none';
    btnDraft.style.display = 'none';
    return;
  }
  btnBack.style.display = '';
  btnNext.style.display = '';
  btnDraft.style.display = '';

  btnBack.style.visibility = STATE.step === 0 ? 'hidden' : 'visible';

  if (STATE.step === 6) {
    btnNext.innerHTML = 'Radicar trámite';
    btnNext.disabled = !STATE.data.aceptaRadicacion;
  } else if (STATE.step === 0) {
    btnNext.textContent = 'Continuar →';
    btnNext.disabled = !(STATE.tipoOrganismo && STATE.tipoTramite);
  } else {
    btnNext.textContent = 'Continuar →';
    btnNext.disabled = false;
  }
}

/* ============================================================
   Validación con shake canónico .naowee-shake
   ============================================================ */
function validateStep1() {
  const errors = [];
  const required = [
    { key:'nombre',    sel:'#f-nombre' },
    { key:'nit',       sel:'#f-nit' },
    { key:'telefono',  sel:'#f-tel' },
    { key:'direccion', sel:'#f-dir' },
    { key:'municipio', sel:'#f-mun' },
    { key:'correo',    sel:'#f-correo' }
  ];
  required.forEach(r => {
    if (!String(STATE.data[r.key] || '').trim()) errors.push(r);
  });
  const correo = String(STATE.data.correo || '').trim();
  if (correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) errors.push({ key:'correo', sel:'#f-correo' });
  return errors;
}

function shakeFields(errors) {
  errors.forEach(e => {
    if (!e.sel) return;
    const el = document.querySelector(e.sel);
    if (!el) return;
    // Caso A: el target está dentro de un .naowee-dropdown (componente canónico DS)
    const ddRoot = el.closest('.naowee-dropdown');
    if (ddRoot) {
      ddRoot.classList.add('naowee-dropdown--error', 'naowee-shake');
      setTimeout(() => ddRoot.classList.remove('naowee-shake'), 500);
      if (!ddRoot.querySelector('.naowee-helper--negative')) {
        const helper = document.createElement('div');
        helper.className = 'naowee-helper naowee-helper--negative';
        helper.style.marginTop = '6px';
        helper.innerHTML = `
          <span class="naowee-helper__badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
          <span class="naowee-helper__text">Este campo es obligatorio</span>
        `;
        ddRoot.appendChild(helper);
      }
      return;
    }
    // Caso B: el target está dentro de un .naowee-textfield
    const wrap = el.closest('.naowee-textfield__input-wrap');
    if (wrap) {
      wrap.classList.add('naowee-shake');
      setTimeout(() => wrap.classList.remove('naowee-shake'), 500);
    }
    const tfRoot = el.closest('.naowee-textfield');
    if (tfRoot) {
      tfRoot.classList.add('naowee-textfield--error');
      // Insertar helper de error si no existe
      if (!tfRoot.querySelector('.naowee-helper--negative')) {
        const helper = document.createElement('div');
        helper.className = 'naowee-helper naowee-helper--negative';
        helper.style.marginTop = '6px';
        helper.innerHTML = `
          <span class="naowee-helper__badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
          <span class="naowee-helper__text">Este campo es obligatorio</span>
        `;
        tfRoot.appendChild(helper);
      }
    }
  });
}

/* ============================================================
   Navegación
   ============================================================ */
function next() {
  if (STATE.step === 0) {
    if (!STATE.tipoOrganismo || !STATE.tipoTramite) {
      alert('Selecciona tipo de organismo y trámite para continuar.');
      return;
    }
  }
  if (STATE.step === 1) {
    const errs = validateStep1();
    if (errs.length) { shakeFields(errs); return; }
  }

  if (STATE.step === 6) {
    STATE.radicado = 'IVC-2026-' + String(Math.floor(10000 + Math.random() * 89999));
    render();
    return;
  }

  let nextStep = STATE.step + 1;
  while (nextStep <= 6 && !isStepApplicable(nextStep)) nextStep++;
  STATE.step = Math.min(nextStep, 6);
  render();
}

function prev() {
  let prevStep = STATE.step - 1;
  while (prevStep >= 0 && !isStepApplicable(prevStep)) prevStep--;
  STATE.step = Math.max(prevStep, 0);
  render();
}

function saveDraft() {
  const btn = document.getElementById('btnDraft');
  if (!btn) return;
  const original = btn.innerHTML;
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Borrador guardado';
  btn.disabled = true;
  setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1800);
}

document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnBack').addEventListener('click', prev);
document.getElementById('btnDraft').addEventListener('click', saveDraft);

/* ============================================================
   Controlador del componente canónico .naowee-dropdown
   (event delegation — sobrevive re-renders)
   ============================================================ */
(function setupNaoweeDropdownController(){
  function closeAll(except){
    document.querySelectorAll('.naowee-dropdown.naowee-dropdown--open').forEach(d => {
      if (d === except) return;
      d.classList.remove('naowee-dropdown--open');
      const trg = d.querySelector('.naowee-dropdown__trigger');
      if (trg) trg.setAttribute('aria-expanded', 'false');
    });
  }

  function runOnChange(wrap, value, text){
    const onChange = wrap.getAttribute('data-on-change') || '';
    if (onChange) {
      try {
        // Los handlers son strings tipo "STATE.x=this.value". Reemplazamos
        // this.value por una referencia literal al valor seleccionado y eval-uamos.
        const literal = JSON.stringify(String(value));
        const code = onChange.replace(/this\.value/g, literal);
        // eslint-disable-next-line no-new-func
        new Function(code)();
      } catch(err) {
        console.error('[naowee-dropdown] onChange error:', err, onChange);
      }
    }
    // CustomEvent para listeners externos
    wrap.dispatchEvent(new CustomEvent('change', { detail:{ value, text }, bubbles:true }));
  }

  // Click delegado
  document.addEventListener('click', function(ev){
    const trigger = ev.target.closest('.naowee-dropdown__trigger');
    const option  = ev.target.closest('.naowee-dropdown__option');

    // Click en una opción
    if (option) {
      const wrap = option.closest('.naowee-dropdown');
      if (!wrap) return;
      const value = option.getAttribute('data-value') || '';
      const text  = option.textContent.trim();
      // marca seleccionada
      wrap.querySelectorAll('.naowee-dropdown__option--selected')
          .forEach(o => o.classList.remove('naowee-dropdown__option--selected'));
      option.classList.add('naowee-dropdown__option--selected');
      // actualiza trigger
      const trg = wrap.querySelector('.naowee-dropdown__trigger');
      const labelSpan = trg.querySelector('.naowee-dropdown__placeholder, .naowee-dropdown__value');
      if (labelSpan) {
        labelSpan.className = 'naowee-dropdown__value';
        labelSpan.textContent = text;
      }
      // limpia error si lo tenía
      wrap.classList.remove('naowee-dropdown--error');
      const helper = wrap.querySelector('.naowee-helper--negative');
      if (helper) helper.remove();
      // cierra
      wrap.classList.remove('naowee-dropdown--open');
      trg.setAttribute('aria-expanded', 'false');
      // dispara onChange
      runOnChange(wrap, value, text);
      ev.stopPropagation();
      return;
    }

    // Click en el trigger → toggle
    if (trigger) {
      const wrap = trigger.closest('.naowee-dropdown');
      if (!wrap) return;
      if (wrap.classList.contains('naowee-dropdown--disabled')) return;
      const wasOpen = wrap.classList.contains('naowee-dropdown--open');
      closeAll(wasOpen ? null : wrap);
      wrap.classList.toggle('naowee-dropdown--open');
      trigger.setAttribute('aria-expanded', wrap.classList.contains('naowee-dropdown--open') ? 'true' : 'false');
      ev.stopPropagation();
      return;
    }

    // Click fuera → cierra todos
    closeAll(null);
  });

  // Teclado
  document.addEventListener('keydown', function(ev){
    const wrap = document.activeElement && document.activeElement.closest && document.activeElement.closest('.naowee-dropdown');
    if (!wrap) {
      if (ev.key === 'Escape') closeAll(null);
      return;
    }
    const isOpen = wrap.classList.contains('naowee-dropdown--open');
    const trg = wrap.querySelector('.naowee-dropdown__trigger');
    const options = Array.from(wrap.querySelectorAll('.naowee-dropdown__option'));

    if (ev.key === 'Escape') {
      wrap.classList.remove('naowee-dropdown--open');
      if (trg) { trg.setAttribute('aria-expanded', 'false'); trg.focus(); }
      ev.preventDefault();
      return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown') && !isOpen && document.activeElement === trg) {
      wrap.classList.add('naowee-dropdown--open');
      trg.setAttribute('aria-expanded', 'true');
      if (options[0]) options[0].focus();
      ev.preventDefault();
      return;
    }
    if (isOpen && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      const focused = document.activeElement.closest('.naowee-dropdown__option');
      const idx = focused ? options.indexOf(focused) : -1;
      const next = ev.key === 'ArrowDown' ? Math.min(options.length - 1, idx + 1) : Math.max(0, idx - 1);
      if (options[next]) options[next].focus();
      ev.preventDefault();
      return;
    }
    if (isOpen && ev.key === 'Enter') {
      const focused = document.activeElement.closest('.naowee-dropdown__option');
      if (focused) { focused.click(); ev.preventDefault(); }
      return;
    }
  });
})();

render();
</script>
