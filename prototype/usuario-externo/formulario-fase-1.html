<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IVC · Radicación · Fase 1 (Demo) — Naowee</title>

<!-- Fuente Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Naowee Design System v1.8.0 canónico -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naowee-tech/naowee-design-system@v1.8.0/dist/design-system.css">

<style>
  /* ============================================================
     CSS scoped al módulo IVC — solo tokens locales para layout
     y patrón wizard-page (no override de clases .naowee-*).
     ============================================================ */
  :root {
    --accent: var(--naowee-color-feedback-fill-caution-loud, #d74009);
    --orange-bg: #fff3e6;
    --text-primary: var(--naowee-color-text-primary, #282834);
    --text-secondary: var(--naowee-color-text-secondary, #646587);
    --border: var(--naowee-color-border-mute, #e7e9f3);
    --border-dark: var(--naowee-color-border-default, #d0d4e6);
    --header-h: 72px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #f5f6fa;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }

  /* ============================================================
     HEADER · estilo v2.0.3 (Ministerio + Naowee + SUID)
     ============================================================ */
  .ivc-top-header {
    height: var(--header-h);
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 90;
  }
  .ivc-top-header__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-right: auto;
  }
  .ivc-top-header__logos {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ivc-top-header__logos img.l-min { height: 38px; width: auto; display: block; }
  .ivc-top-header__logos img.l-suid { height: 28px; width: auto; display: block; }
  .ivc-top-header__logos img.l-naowee { height: 22px; width: auto; display: block; opacity: .9; }
  .ivc-top-header__sep {
    width: 1px; height: 28px; background: var(--border);
  }
  .ivc-top-header__title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .ivc-top-header__subtitle {
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .ivc-top-header__meta {
    display: flex; align-items: center; gap: 12px;
  }
  @media (max-width: 760px) {
    .ivc-top-header { padding: 0 16px; }
    .ivc-top-header__logos img.l-naowee,
    .ivc-top-header__sep { display: none; }
    .ivc-top-header__title-wrap { display: none; }
  }

  /* ============================================================
     WIZARD-PAGE pattern (espejo de v2.0.3/shared/wizard-page.css)
     ============================================================ */
  .wz-page {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .wz-page__header { margin-bottom: 18px; }
  .wz-page__title {
    margin: 8px 0 4px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text-primary);
    line-height: 1.15;
  }
  .wz-page__subtitle {
    color: var(--text-secondary);
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .wz-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    /* FIX #3: elevation removida — card plana contra el fondo (Doug 23/05/2026) */
    overflow: hidden;
  }

  /* Stepper wrapper (usa .naowee-stepper canónico)
     v1.4.7 (23/05/2026): layout vertical (número arriba / label abajo) +
     connector alineado a la altura del número (no del label). Resuelve:
     1) pulse del paso activo no se corta (overflow visible + padding-top)
     2) líneas de progreso ya no pisan los labels (van a la altura del círculo) */
  .wz-stepper-wrap {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    background: #fff;
    overflow: visible;
  }
  .wz-stepper-wrap .naowee-stepper {
    width: 100%;
    max-width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0;
    padding: 0;
    background: transparent;
    border-bottom: 0;
    overflow: visible;
  }
  .wz-stepper-wrap .naowee-stepper__step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    flex-shrink: 0;
    cursor: default;
    min-width: 0;
  }
  .wz-stepper-wrap .naowee-stepper__number {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
    background: #f5f6fa;
    color: var(--text-secondary);
    transition: all .2s;
  }
  /* FIX #2 (23/05/2026): labels completos en el stepper (sin abreviar/ellipsis).
     11.5px en pasos no-activos, 13px en el activo, el wrap permite que entren los
     7 nombres en desktop manteniendo el separador como flex:1. */
  .wz-stepper-wrap .naowee-stepper__label {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: color .2s, font-size .2s;
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__number {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 4px rgba(215,64,9,.12);
  }
  .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
    animation: wzStepperPulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  @keyframes wzStepperPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(215, 64, 9, .45); }
    50%      { box-shadow: 0 0 0 8px rgba(215, 64, 9, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wz-stepper-wrap .naowee-stepper--pulse .naowee-stepper__step--active .naowee-stepper__number {
      animation: none;
    }
  }
  .wz-stepper-wrap .naowee-stepper__step--active .naowee-stepper__label {
    color: var(--text-primary);
    font-weight: 600;
    font-size: 13px;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__number {
    background: #15803d; color: #fff;
  }
  .wz-stepper-wrap .naowee-stepper__step--done .naowee-stepper__label {
    color: var(--text-primary);
  }
  .wz-stepper-wrap .naowee-stepper__step--done { cursor: pointer; }
  .wz-stepper-wrap .naowee-stepper__step--done:hover .naowee-stepper__label { color: var(--accent); }
  .wz-stepper-wrap .naowee-stepper__connector {
    flex: 1 1 auto;
    height: 2px;
    background: var(--border);
    margin: 12px 8px 0;   /* margin-top alinea con el centro del número 26px */
    border-radius: 1px;
    min-width: 8px;
    align-self: flex-start;
  }
  .wz-stepper-wrap .naowee-stepper__connector--done { background: #15803d; }

  .wz-stepper-mobile {
    display: none;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .wz-stepper-mobile small {
    display: block;
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }
  @media (max-width: 760px) {
    .wz-stepper-wrap { display: none; }
    .wz-stepper-mobile { display: block; }
  }

  /* Body wizard */
  .wz-body { padding: 24px 28px; }
  .wz-step-panel { display: none; animation: wzStepFadeIn .3s cubic-bezier(.32,.72,0,1) both; }
  .wz-step-panel.is-active { display: block; }
  @keyframes wzStepFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .wz-section {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: #b5b9d4;
    margin: 22px 0 12px;
  }
  .wz-section:first-child { margin-top: 0; }
  .wz-grid-2 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  .wz-grid-3 {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
    margin-bottom: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .wz-grid-2, .wz-grid-3 { grid-template-columns: 1fr; }
  }
  .wz-step-panel > .naowee-textfield,
  .wz-step-panel > .naowee-dropdown { margin-bottom: 18px; }
  .wz-grid-2 > .naowee-textfield,
  .wz-grid-2 > .naowee-dropdown,
  .wz-grid-3 > .naowee-textfield,
  .wz-grid-3 > .naowee-dropdown { margin-bottom: 0; }

  /* Footer wizard */
  .wz-footer {
    padding: 18px 28px;
    border-top: 1px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
  /* File drop (canónico v2.0.3) */
  .wz-file-drop {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    padding: 24px 18px;
    border: 1.5px dashed var(--border-dark);
    border-radius: 12px;
    background: #fafbff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .wz-file-drop:hover { border-color: var(--accent); background: #fff8f4; }
  .wz-file-drop.is-filled {
    border-style: solid;
    border-color: #15803d;
    background: #f0faf2;
  }
  .wz-file-drop__icon { color: var(--text-secondary); }
  .wz-file-drop.is-filled .wz-file-drop__icon { color: #15803d; }
  .wz-file-drop__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  .wz-file-drop__hint { font-size: 12px; color: var(--text-secondary); text-align: center; }
  .wz-file-drop__name { font-size: 12.5px; font-weight: 600; color: #15803d; margin-top: 4px; }
  .wz-file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* Cards de documento (lista de cargas paso 6) */
  .ivc-doc-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fff;
    margin-bottom: 14px;
  }
  .ivc-doc-card__head {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .ivc-doc-card__title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    margin: 0;
  }
  .ivc-doc-card__desc {
    font-size: 12.5px; color: var(--text-secondary);
    margin: 2px 0 0;
  }

  /* ============================================================
     FIX #6 — Datepicker canónico (clases scoped no-DS para vistas
     months/years que no están en design-system.css). Doug 23/05/2026.
     ============================================================ */
  .naowee-datepicker__month-selector {
    background: transparent !important;
    border: none !important;
    padding: 4px 8px;
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background .12s;
  }
  .naowee-datepicker__month-selector:hover,
  .naowee-datepicker__month-selector:focus-visible {
    background: var(--naowee-color-interactive-fill-quiet-idle, #fff3e6) !important;
    outline: none;
  }
  .naowee-datepicker-field__clear[hidden] {
    display: none !important;
  }
  /* Vistas months/years del calendario (no están en el DS) */
  .dp-view--months,
  .dp-view--years {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .dp-cell {
    padding: 12px 6px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background .12s;
  }
  .dp-cell:hover { background: var(--naowee-color-interactive-fill-mute-hover, #f4f5f9); }
  .dp-cell--selected {
    background: var(--naowee-color-interactive-fill-loud-idle, #d74009) !important;
    color: white !important;
    font-weight: 600;
  }
  /* Datepicker popover portaled — necesita fixed positioning para escapar containers */
  .naowee-datepicker--popover {
    position: fixed;
    z-index: 9999;
  }
  .naowee-datepicker-field__value.is-placeholder {
    color: var(--text-secondary);
  }
  /* FIX #3 (23/05/2026): cursor pointer en el input del datepicker + ícono/chevron
     en naranja al hover (mismo patrón que v2.0.3 shared/modal-convocatoria.js:414). */
  .naowee-datepicker-field__input {
    cursor: pointer;
  }
  .naowee-datepicker-field__input:hover .naowee-datepicker-field__icon,
  .naowee-datepicker-field__input:hover .naowee-datepicker-field__chevron {
    color: var(--naowee-color-text-accent, #d74009);
  }
  .naowee-datepicker-field--active .naowee-datepicker-field__icon,
  .naowee-datepicker-field--active .naowee-datepicker-field__chevron {
    color: var(--naowee-color-text-accent, #d74009);
  }

  /* Tablas repeatable */
  .ivc-repeatable {
    border: 1px solid var(--border);
    border-radius: 12px;
    /* overflow visible para que el .naowee-dropdown__menu pueda
       desbordar la fila sin ser clipped por el contenedor */
    overflow: visible;
    background: #fff;
  }
  /* Dropdown inline en filas repetibles: ancho 100%, mismo look que ivc-mini-input.
     `.ivc-dropdown--inline` es scope custom IVC, NO del DS canónico (el DS solo define
     .naowee-dropdown sin variante --inline). Lo usamos junto a .naowee-dropdown. */
  .ivc-repeatable__row .ivc-dropdown--inline { width: 100%; }
  .ivc-repeatable__row .ivc-dropdown--inline .naowee-dropdown__menu {
    /* Permite el menú flotante por encima de filas siguientes */
    z-index: 1000;
  }
  .ivc-repeatable__head,
  .ivc-repeatable__row {
    display: grid;
    gap: 10px;
    padding: 12px 14px;
    align-items: center;
  }
  .ivc-repeatable__head {
    background: #fafbff;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .ivc-repeatable__row + .ivc-repeatable__row { border-top: 1px dashed var(--border); }
  .ivc-repeatable__row input.ivc-mini-input,
  .ivc-repeatable__row select.ivc-mini-input {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border-dark);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .ivc-repeatable__row input.ivc-mini-input:focus,
  .ivc-repeatable__row select.ivc-mini-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(215,64,9,.15);
  }
  /* FIX #5 (23/05/2026): datepicker canónico en filas repeatable.
     Usa la variante --small del DS (height 32-36px) ajustada para encajar en
     la altura visual del ivc-mini-input (36px). */
  .ivc-repeatable__row .naowee-datepicker-field { width: 100%; }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__input {
    height: 36px;
    padding: 0 8px;
    border-radius: 6px;
    border-color: var(--border-dark);
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__icon,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__icon svg {
    width: 16px; height: 16px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__chevron,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__chevron svg {
    width: 14px; height: 14px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__clear,
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__clear svg {
    width: 14px; height: 14px;
  }
  .ivc-repeatable__row .naowee-datepicker-field--small .naowee-datepicker-field__value {
    font-size: 12px;
  }
  .ivc-repeatable__row-display {
    font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  }
  /* FIX #6 (23/05/2026): el botón de borrar fila usa el componente canónico
     .naowee-btn--quiet (stroke accent + naranja en hover) — esta clase solo
     ajusta el width del icono dentro del grid del repeatable. */
  .ivc-repeatable__row .ivc-repeatable__remove,
  .ivc-repeatable__row .naowee-btn--icon.naowee-btn--small.ivc-repeatable__remove {
    width: 32px;
    justify-self: center;
  }
  .ivc-repeatable__remove[disabled] { opacity: .35; cursor: not-allowed; }
  .ivc-repeatable__add {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #fafbff;
    /* FIX #7: CTA "+ Agregar fila" alineado a la izquierda (Doug 23/05/2026) */
    text-align: left;
  }

  /* Resumen final (paso 7) */
  .wz-review { display: grid; gap: 14px; }
  .wz-review__group {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fbfbfd;
  }
  .wz-review__group-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .wz-review__row {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 12px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
  .wz-review__row:last-child { border-bottom: 0; }
  .wz-review__label { color: var(--text-secondary); font-weight: 500; }
  .wz-review__value { color: var(--text-primary); font-weight: 600; word-break: break-word; }
  @media (max-width: 640px) {
    .wz-review__row { grid-template-columns: 1fr; gap: 2px; }
  }

  /* FIX #7 (23/05/2026): Pantalla de éxito con confetti + congrats portada del
     módulo de Incentivos (naowee-test-incentivos/incentivo-11-asignar-exito.html
     líneas 16-63 + 321-334). Clases custom no-DS (scoped a la pantalla de éxito):
     .success-wrap, .success-hero, .success-check, .success-stamp, .confetti,
     .receipt, .kv-row — mismo lenguaje visual que Incentivos.

     v1.4.2 (23/05/2026): el banner de estado migrado de .status-banner custom
     a .naowee-message--informative canónico. Comprobante refactorizado con
     íconos por row + jerarquía + highlight del Plazo + Estado como badge. */
  .success-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 0 28px;
    animation: fadeInUp .4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .success-hero {
    background: linear-gradient(180deg, #fff 0%, #fafbfd 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .success-hero::before {
    content: "";
    position: absolute;
    top: -40px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(31,137,35,.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .success-check {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25a12a, #1f8923);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 8px 28px rgba(31,137,35,.35);
    animation: successPop .5s cubic-bezier(.34,1.56,.64,1);
    position: relative; z-index: 1;
  }
  @keyframes successPop {
    0%   { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .success-hero h1 {
    font-size: 28px; font-weight: 800; letter-spacing: -.02em;
    margin: 0 0 8px;
    position: relative; z-index: 1;
    color: var(--text-primary);
  }
  .success-hero p {
    font-size: 14px; color: var(--text-secondary);
    line-height: 1.5;
    max-width: 480px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .success-stamp {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px;
    font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', monospace;

/* ============================================================

   ============================================================ */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function dispValue(v) { return v && String(v).trim() ? esc(v) : '<span style="color:var(--text-secondary);font-style:italic">(no diligenciado)</span>'; }

function isStepApplicable(idx) {
  if (idx === 3 && STATE.tipoOrganismo === 'asociacion') return false;

}

function fileSizeFmt(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

function getStateAtPath(path) {
  const parts = path.split('.');
  let cur = STATE;
  for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
  return cur;
}
function setStateAtPath(path, val) {
  const parts = path.split('.');
  let cur = STATE;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}
function clearStateAtPath(path) { setStateAtPath(path, null); }

function mockUpload(input, statePath) {
  const f = input.files && input.files[0];
  if (!f) return;
  setStateAtPath(statePath, { name: f.name, size: fileSizeFmt(f.size) });
  render();
}

/* ============================================================

// Textfield canónico .naowee-textfield
function tf(opts) {
  const id = opts.id || ('tf-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const placeholder = opts.placeholder || '';
  const type = opts.type || 'text';
  const onInput = opts.onInput || '';
  const helper = opts.helper || '';
  const error = opts.error || '';
  const variant = error ? ' naowee-textfield--error' : '';
  return `
    <div class="naowee-textfield${variant}" data-tf-id="${id}">
      <label class="naowee-textfield__label${required ? ' naowee-textfield__label--required' : ''}" for="${id}">${esc(label)}</label>
      <div class="naowee-textfield__input-wrap">
        <input class="naowee-textfield__input" id="${id}" type="${type}" placeholder="${escAttr(placeholder)}" value="${escAttr(value)}" oninput="${onInput}" />
      </div>
      ${helper ? `<span class="naowee-textfield__helper" style="font-size:11.5px;color:var(--text-secondary);margin-top:6px;display:block;">${esc(helper)}</span>` : ''}
      ${error ? helperNegative(error) : ''}
    </div>
  `;
}

// Textarea (usa .naowee-textfield--textarea)
function ta(opts) {
  const id = opts.id || ('ta-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const placeholder = opts.placeholder || '';
  const maxlength = opts.maxlength || 2000;
  const onInput = opts.onInput || '';
  const counterId = opts.counterId || '';
  return `
    <div class="naowee-textfield naowee-textfield--textarea">
      <label class="naowee-textfield__label${required ? ' naowee-textfield__label--required' : ''}" for="${id}">${esc(label)}</label>
      <div class="naowee-textfield__input-wrap" style="height:auto;padding:10px 12px;">
        <textarea class="naowee-textfield__input" id="${id}" placeholder="${escAttr(placeholder)}" maxlength="${maxlength}" rows="4" style="min-height:88px;resize:vertical;line-height:1.5;border:0;outline:none;width:100%;background:transparent;font-family:inherit;font-size:14px;color:inherit;" oninput="${onInput}">${esc(value)}</textarea>
      </div>
      ${counterId ? `<div class="ivc-counter"><span id="${counterId}">${value.length}</span>/${maxlength}</div>` : ''}
    </div>
  `;
}

// Helper canónico .naowee-helper--negative
function helperNegative(msg) {
  return `
    <div class="naowee-helper naowee-helper--negative" style="margin-top:6px;">
      <span class="naowee-helper__badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
      <span class="naowee-helper__text">${esc(msg)}</span>
    </div>
  `;
}

// Dropdown — componente canónico .naowee-dropdown del DS Naowee v1.8.0
// El JS controlador está al final del archivo (initDropdowns)
// Opciones soportadas por entrada: { v, t, disabled? }
function dd(opts) {
  const id = opts.id || ('dd-' + Math.random().toString(36).slice(2,8));
  const label = opts.label || '';
  const required = !!opts.required;
  const value = opts.value || '';
  const options = opts.options || [];
  // onChange recibe el valor seleccionado. Se invoca desde el controlador
  // simulando un input con .value (compatibilidad con strings tipo "STATE.x=this.value")
  const onChange = opts.onChange || '';
  // Encuentra placeholder (option con v='') y opción seleccionada
  const placeholderOpt = options.find(o => o.v === '');
  const placeholderText = placeholderOpt ? placeholderOpt.t : 'Selecciona…';
  const selectedOpt = options.find(o => o.v === value && o.v !== '');
  const hasValue = !!selectedOpt;
  // Filtra placeholder fuera del menú visible (DS usa el placeholder en el trigger, no como opción)
  const menuOptions = options.filter(o => o.v !== '');
  return `
    <div class="naowee-dropdown" id="${id}-wrap" data-dd-id="${id}"${required ? ' data-required="true"' : ''} data-on-change="${escAttr(onChange)}">
      <label class="naowee-dropdown__label${required ? ' naowee-dropdown__label--required' : ''}">${esc(label)}</label>
      <button type="button" id="${id}" class="naowee-dropdown__trigger" aria-haspopup="listbox" aria-expanded="false">
        ${hasValue
          ? `<span class="naowee-dropdown__value">${esc(selectedOpt.t)}</span>`
          : `<span class="naowee-dropdown__placeholder">${esc(placeholderText)}</span>`}
        <div class="naowee-dropdown__controls">
          <span class="naowee-dropdown__chevron">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
          </span>
        </div>
      </button>
      <div class="naowee-dropdown__menu" role="listbox" data-placeholder="${escAttr(placeholderText)}">
        ${menuOptions.map(o => {
          const isDisabled = !!o.disabled;
          const cls = 'naowee-dropdown__option'
            + (o.v === value ? ' naowee-dropdown__option--selected' : '')
            + (isDisabled ? ' naowee-dropdown__option--disabled' : '');
          const ariaDisabled = isDisabled ? ' aria-disabled="true"' : '';
          return `<div class="${cls}" role="option" data-value="${escAttr(o.v)}" tabindex="-1"${ariaDisabled}>${esc(o.t)}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// Dropdown compacto para filas repetibles (mismo .naowee-dropdown del DS pero sin label,
// con --inline para celdas estrechas de tablas dinámicas)
function ddInline(opts) {
  const id = opts.id || ('ddi-' + Math.random().toString(36).slice(2,8));
  const value = opts.value || '';
  const options = opts.options || [];
  const onChange = opts.onChange || '';
  const placeholderOpt = options.find(o => o.v === '');
  const placeholderText = placeholderOpt ? placeholderOpt.t : '—';
  const selectedOpt = options.find(o => o.v === value && o.v !== '');
  const hasValue = !!selectedOpt;
  const menuOptions = options.filter(o => o.v !== '');
  return `
    <div class="naowee-dropdown ivc-dropdown--inline" id="${id}-wrap" data-dd-id="${id}" data-on-change="${escAttr(onChange)}" style="position:relative;">
      <button type="button" id="${id}" class="naowee-dropdown__trigger" aria-haspopup="listbox" aria-expanded="false" style="height:38px;padding:0 10px;font-size:13px;">
        ${hasValue
          ? `<span class="naowee-dropdown__value" style="font-size:13px;">${esc(selectedOpt.t)}</span>`
          : `<span class="naowee-dropdown__placeholder" style="font-size:13px;">${esc(placeholderText)}</span>`}
        <div class="naowee-dropdown__controls">
          <span class="naowee-dropdown__chevron">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
          </span>
        </div>
      </button>
      <div class="naowee-dropdown__menu" role="listbox" data-placeholder="${escAttr(placeholderText)}">
        ${menuOptions.map(o => `<div class="naowee-dropdown__option${o.v === value ? ' naowee-dropdown__option--selected' : ''}" role="option" data-value="${escAttr(o.v)}" tabindex="-1">${esc(o.t)}</div>`).join('')}
      </div>
    </div>
  `;
}

// FIX #6 — Datepicker canónico Naowee (portado desde Project v2.0.3
// shared/modal-convocatoria.js líneas 121-180, 1610-1994).

const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_ES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function datepicker(opts) {
  const label = opts.label || '';
  const name = opts.name;
  const required = !!opts.required;
  const placeholder = opts.placeholder || 'dd mmm aaaa';
  const helper = opts.helper || '';
  const value = opts.value || ''; // ISO yyyy-mm-dd
  const calendarIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  const clearIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  const chevronIcon2 = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  // Display inicial — si hay value ISO, mostrar formato largo
  let displayText = placeholder;
  let isPlaceholder = true;
  if (value) {
    const d = new Date(value);
    if (!isNaN(d.getTime())) {
      displayText = `${d.getDate()} de ${MESES_ES[d.getMonth()]} de ${d.getFullYear()}`;
      isPlaceholder = false;
    }
  }
  return `
    <div class="naowee-datepicker-field" data-name="${escAttr(name)}" data-selected="${escAttr(value)}" data-on-change="${escAttr(opts.onChange || '')}">
      <label class="naowee-textfield__label ${required ? 'naowee-textfield__label--required' : ''}">${esc(label)}</label>
      <div class="naowee-datepicker-field__input" tabindex="0" role="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="naowee-datepicker-field__icon">${calendarIcon}</span>
        <span class="naowee-datepicker-field__value${isPlaceholder ? ' is-placeholder' : ''}" data-placeholder="${escAttr(placeholder)}">${esc(displayText)}</span>
        <div class="naowee-datepicker-field__controls">
          <button type="button" class="naowee-datepicker-field__clear" aria-label="Limpiar fecha"${isPlaceholder ? ' hidden' : ''}>${clearIcon}</button>
          <span class="naowee-datepicker-field__chevron">${chevronIcon2}</span>
        </div>
      </div>
      <input type="hidden" name="${escAttr(name)}" value="${escAttr(value)}"${required ? ' required' : ''}/>
      <div class="naowee-datepicker naowee-datepicker--popover naowee-datepicker--compact" hidden>
        <div class="naowee-datepicker__calendar" data-mode="days">
          <div class="naowee-datepicker__header">
            <button type="button" class="naowee-datepicker__month-selector" aria-label="Cambiar vista">
              <span class="naowee-datepicker__month"></span>
              <span class="naowee-datepicker__month-chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg>
              </span>
            </button>
            <div class="naowee-datepicker__controls">
              <button type="button" class="naowee-datepicker__nav" data-nav="-1" aria-label="Anterior">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button type="button" class="naowee-datepicker__nav" data-nav="1" aria-label="Siguiente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
          </div>
          <div class="naowee-datepicker__content">
            <div class="dp-view dp-view--days">
              <div class="naowee-datepicker__week">
                <span class="naowee-datepicker__weekday">Lun</span>
                <span class="naowee-datepicker__weekday">Mar</span>
                <span class="naowee-datepicker__weekday">Mié</span>
                <span class="naowee-datepicker__weekday">Jue</span>
                <span class="naowee-datepicker__weekday">Vie</span>
                <span class="naowee-datepicker__weekday">Sab</span>
                <span class="naowee-datepicker__weekday">Dom</span>
              </div>
              <div class="naowee-datepicker__days"></div>
            </div>
            <div class="dp-view dp-view--months" hidden></div>
            <div class="dp-view dp-view--years" hidden></div>
          </div>
        </div>
      </div>
      ${helper ? `<div class="naowee-helper"><span class="naowee-helper__text"><span>${esc(helper)}</span></span></div>` : ''}
    </div>
  `;
}

function formatDateLong(d) {
  return `${d.getDate()} de ${MESES_ES[d.getMonth()]} de ${d.getFullYear()}`;
}

function buildDaysHTML(viewYear, viewMonth, selectedISO) {
  const selected = selectedISO ? new Date(selectedISO) : null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const first = new Date(viewYear, viewMonth, 1);
  let firstDow = first.getDay() - 1; if (firstDow < 0) firstDow = 6;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

  let html = '';
  for (let w = 0; w < 6; w++) {
    html += '<div class="naowee-datepicker__week">';
    for (let d = 0; d < 7; d++) {
      const i = w * 7 + d;
      let dayNum, isOther = false, year = viewYear, month = viewMonth;
      if (i < firstDow) {
        dayNum = daysInPrev - firstDow + 1 + i;
        isOther = true;
        month = viewMonth - 1;
        if (month < 0) { month = 11; year--; }
      } else if (i >= firstDow + daysInMonth) {
        dayNum = i - firstDow - daysInMonth + 1;
        isOther = true;
        month = viewMonth + 1;
        if (month > 11) { month = 0; year++; }
      } else {
        dayNum = i - firstDow + 1;
      }
      const cellDate = new Date(year, month, dayNum);
      cellDate.setHours(0, 0, 0, 0);
      const isSelected = selected && cellDate.toDateString() === selected.toDateString();
      const isToday = cellDate.toDateString() === today.toDateString();
      const classes = [
        'naowee-datepicker__day',
        isOther ? 'naowee-datepicker__day--other-month' : '',
        isSelected ? 'naowee-datepicker__day--selected' : '',
        isToday && !isSelected ? 'naowee-datepicker__day--today' : ''
      ].filter(Boolean).join(' ');
      // ISO local format yyyy-mm-dd para evitar shift de timezone
      const iso = `${year}-${String(month + 1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
      html += `<button type="button" class="${classes}" data-iso="${iso}">${dayNum}</button>`;
    }
    html += '</div>';
  }
  return html;
}

function setDatepickerValue(field, iso, dateObj) {
  field.dataset.selected = iso || '';
  const valueEl = field.querySelector('.naowee-datepicker-field__value');
  const hiddenInput = field.querySelector('input[type="hidden"][name]');
  const clearBtn = field.querySelector('.naowee-datepicker-field__clear');
  if (iso && dateObj) {
    valueEl.textContent = formatDateLong(dateObj);
    valueEl.classList.remove('is-placeholder');
    if (hiddenInput) hiddenInput.value = iso;
    if (clearBtn) clearBtn.hidden = false;
  } else {
    const placeholder = valueEl.dataset.placeholder || 'dd mmm aaaa';
    valueEl.textContent = placeholder;
    valueEl.classList.add('is-placeholder');
    if (hiddenInput) hiddenInput.value = '';
    if (clearBtn) clearBtn.hidden = true;
  }
  // Dispatch onChange — strings tipo "STATE.x=this.value"
  const onChange = field.dataset.onChange || '';
  if (onChange) {
    try {
      const literal = JSON.stringify(String(iso || ''));
      const code = onChange.replace(/this\.value/g, literal);
      new Function(code)();
    } catch(err) {
      // Silencioso — datepicker no rompe la pantalla por un onChange roto
    }
  }
  if (hiddenInput) hiddenInput.dispatchEvent(new Event('input', { bubbles: true }));
}

function renderCalendarPortal(popover, field, viewYear, viewMonth) {
  const calendar = popover.querySelector('.naowee-datepicker__calendar');
  const mode = calendar.dataset.mode || 'days';
  const monthLabel = popover.querySelector('.naowee-datepicker__month');
  const viewDays = popover.querySelector('.dp-view--days');
  const viewMonths = popover.querySelector('.dp-view--months');
  const viewYears = popover.querySelector('.dp-view--years');
  const daysWrap = popover.querySelector('.naowee-datepicker__days');

  viewDays.style.display = mode === 'days' ? '' : 'none';
  viewMonths.style.display = mode === 'months' ? 'grid' : 'none';
  viewYears.style.display = mode === 'years' ? 'grid' : 'none';
  viewDays.hidden = mode !== 'days';
  viewMonths.hidden = mode !== 'months';
  viewYears.hidden = mode !== 'years';

  const closePopover = () => {
    popover.hidden = true;
    popover.classList.remove('naowee-datepicker--open');
    field.classList.remove('naowee-datepicker-field--active');
    const inp = field.querySelector('.naowee-datepicker-field__input');
    if (inp) {
      inp.setAttribute('aria-expanded', 'false');
      inp.style.removeProperty('border-color');
      inp.style.removeProperty('box-shadow');
    }
  };

  if (mode === 'days') {
    monthLabel.textContent = `${MESES_ES[viewMonth]} ${viewYear}`;
    daysWrap.innerHTML = buildDaysHTML(viewYear, viewMonth, field.dataset.selected || '');
    daysWrap.querySelectorAll('.naowee-datepicker__day:not(.naowee-datepicker__day--disabled)').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const iso = btn.dataset.iso;
        // Parse ISO as local date (evitar shift de timezone)
        const [yy, mm, dd] = iso.split('-').map(Number);
        const d = new Date(yy, mm - 1, dd);
        setDatepickerValue(field, iso, d);
        renderCalendarPortal(popover, field, d.getFullYear(), d.getMonth());
        closePopover();
      });
    });
  }

  if (mode === 'months') {
    monthLabel.textContent = String(viewYear);
    const selectedMonth = field.dataset.selected ? new Date(field.dataset.selected).getMonth() : -1;
    const selectedYear = field.dataset.selected ? new Date(field.dataset.selected).getFullYear() : -1;
    viewMonths.innerHTML = MESES_ES_CORTO.map((m, i) => {
      const isSelected = i === selectedMonth && viewYear === selectedYear;
      return `<button type="button" class="dp-cell ${isSelected ? 'dp-cell--selected' : ''}" data-month="${i}">${m}</button>`;
    }).join('');
    viewMonths.querySelectorAll('[data-month]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = parseInt(btn.dataset.month);
        calendar.dataset.mode = 'days';
        renderCalendarPortal(popover, field, viewYear, m);
      });
    });
  }

  if (mode === 'years') {
    const startYear = Math.floor(viewYear / 12) * 12;
    const endYear = startYear + 11;
    monthLabel.textContent = `${startYear} - ${endYear}`;
    const selectedYear = field.dataset.selected ? new Date(field.dataset.selected).getFullYear() : -1;
    let html = '';
    for (let y = startYear; y <= endYear; y++) {
      const isSelected = y === selectedYear;
      html += `<button type="button" class="dp-cell ${isSelected ? 'dp-cell--selected' : ''}" data-year="${y}">${y}</button>`;
    }
    viewYears.innerHTML = html;
    viewYears.querySelectorAll('[data-year]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const y = parseInt(btn.dataset.year);
        calendar.dataset.mode = 'months';
        renderCalendarPortal(popover, field, y, viewMonth);
      });
    });
  }
}

function bindDatepickers(scope) {
  if (!scope) return;
  const popovers = [];
  scope.querySelectorAll('.naowee-datepicker-field').forEach(field => {
    // Si ya fue bound (post re-render), buscar el popover en body y re-bindear
    if (field._dpBound) return;
    field._dpBound = true;

    let popover = field.querySelector('.naowee-datepicker--popover');
    const inputContainer = field.querySelector('.naowee-datepicker-field__input');
    const valueEl = field.querySelector('.naowee-datepicker-field__value');
    const clearBtn = field.querySelector('.naowee-datepicker-field__clear');

    // Portal: mover popover al body (escapa overflow del wizard)
    if (popover && popover.parentElement !== document.body) {
      document.body.appendChild(popover);
    }
    field._popover = popover;
    popovers.push({ field, popover });

    let viewDate = field.dataset.selected ? new Date(field.dataset.selected) : new Date();
    if (isNaN(viewDate.getTime())) viewDate = new Date();

    const positionPopover = () => {
      const rect = inputContainer.getBoundingClientRect();
      const popoverWidth = popover.offsetWidth || 320;
      const popoverHeight = popover.offsetHeight || 320;
      const margin = 16;

      let left = rect.left;
      if (left + popoverWidth > window.innerWidth - margin) {
        left = Math.max(margin, rect.right - popoverWidth);
      }

      // Flip-up cuando no cabe debajo
      const spaceBelow = window.innerHeight - rect.bottom - margin;
      const spaceAbove = rect.top - margin;
      let top;
      if (spaceBelow >= popoverHeight + 6 || spaceBelow >= spaceAbove) {
        top = rect.bottom + 6;
        if (top + popoverHeight > window.innerHeight - margin) {
          top = Math.max(margin, window.innerHeight - margin - popoverHeight);
        }
      } else {
        top = rect.top - popoverHeight - 6;
        if (top < margin) top = margin;
      }

      popover.style.top = top + 'px';
      popover.style.left = left + 'px';
    };

    const open = () => {
      popovers.forEach(({ field: f, popover: p }) => {
        if (p !== popover) {
          p.hidden = true;
          p.classList.remove('naowee-datepicker--open');
          f.classList.remove('naowee-datepicker-field--active');
          const otherInput = f.querySelector('.naowee-datepicker-field__input');
          otherInput?.setAttribute('aria-expanded', 'false');
          if (otherInput) {
            otherInput.style.removeProperty('border-color');
            otherInput.style.removeProperty('box-shadow');
          }
        }
      });
      popover.hidden = false;
      requestAnimationFrame(() => popover.classList.add('naowee-datepicker--open'));
      field.classList.add('naowee-datepicker-field--active');
      inputContainer.setAttribute('aria-expanded', 'true');
      inputContainer.style.setProperty('border-color', '#d74009', 'important');
      inputContainer.style.setProperty('box-shadow', '0 0 0 3px rgba(215,64,9,.15)', 'important');
      const calendar = popover.querySelector('.naowee-datepicker__calendar');
      calendar.dataset.mode = 'days';
      renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
      positionPopover();
      const monthSelector = popover.querySelector('.naowee-datepicker__month-selector');
      monthSelector.onclick = (e) => {
        e.stopPropagation();
        const m = calendar.dataset.mode || 'days';
        calendar.dataset.mode = m === 'days' ? 'months' : m === 'months' ? 'years' : 'days';
        renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
      };
      popover.querySelectorAll('.naowee-datepicker__nav').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const dir = parseInt(btn.dataset.nav);
          const m = calendar.dataset.mode || 'days';
          if (m === 'days') {
            viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + dir, 1);
          } else if (m === 'months') {
            viewDate = new Date(viewDate.getFullYear() + dir, viewDate.getMonth(), 1);
          } else {
            viewDate = new Date(viewDate.getFullYear() + (dir * 12), viewDate.getMonth(), 1);
          }
          renderCalendarPortal(popover, field, viewDate.getFullYear(), viewDate.getMonth());
        };
      });
    };

    const close = () => {
      popover.hidden = true;
      popover.classList.remove('naowee-datepicker--open');
      field.classList.remove('naowee-datepicker-field--active');
      inputContainer.setAttribute('aria-expanded', 'false');
      inputContainer.style.removeProperty('border-color');
      inputContainer.style.removeProperty('box-shadow');
    };

    const reposition = () => { if (!popover.hidden) positionPopover(); };
    // Scope scroll: el wizard scrolea en window (no en wz-body), pero
    // si hay scrollers internos los cubrimos también.
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition);

    const toggle = (e) => {
      e.stopPropagation();
      if (popover.hidden) open();
      else close();
    };

    inputContainer.addEventListener('click', (e) => {
      if (e.target.closest('.naowee-datepicker-field__clear')) return;
      toggle(e);
    });

    inputContainer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle(e);
      } else if (e.key === 'Escape' && !popover.hidden) {
        close();
      }
    });

    if (clearBtn) {
      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setDatepickerValue(field, null, null);
        viewDate = new Date();
      });
    }

    popover.addEventListener('click', (e) => e.stopPropagation());
  });

  // Click fuera cierra todos los popovers (sólo se bindea una vez global)
  if (!document._dpClickBound) {
    document._dpClickBound = true;
    document.addEventListener('click', (e) => {
      if (e.target.closest('.naowee-datepicker-field')) return;
      if (e.target.closest('.naowee-datepicker--popover')) return;
      document.querySelectorAll('body > .naowee-datepicker--popover:not([hidden])').forEach(p => {
        p.hidden = true;
        p.classList.remove('naowee-datepicker--open');
        // Buscar el field origen via data-name
        const name = p.dataset.field || '';
        // No siempre tenemos dataset.field; el match correcto es por referencia,
        // pero al portar al body perdemos eso. Como fallback, limpiamos todos
        // los fields activos en el scope visible.
        document.querySelectorAll('.naowee-datepicker-field--active').forEach(f => {
          f.classList.remove('naowee-datepicker-field--active');
          const inp = f.querySelector('.naowee-datepicker-field__input');
          if (inp) {
            inp.setAttribute('aria-expanded', 'false');
            inp.style.removeProperty('border-color');
            inp.style.removeProperty('box-shadow');
          }
        });
      });
    });
  }
}

// Radio canónico .naowee-radio
function radio(opts) {
  const name = opts.name;
  const value = opts.value;
  const checked = opts.checked === value;
  const label = opts.label || '';
  const sub = opts.sub || '';
  const onClick = opts.onClick || '';
  return `
    <label class="naowee-radio${checked ? ' naowee-radio--selected' : ''}" style="cursor:pointer;align-items:flex-start;padding:14px 16px;border:1.5px solid ${checked ? 'var(--accent)' : 'var(--border-dark)'};border-radius:8px;transition:all .15s;background:${checked ? 'var(--orange-bg)' : '#fff'};display:flex;gap:12px;" onclick="${onClick}">
      <span class="naowee-radio__circle" style="margin-top:1px;flex-shrink:0;"></span>
      <span class="naowee-radio__label" style="font-size:14px;font-weight:${sub ? '600' : '500'};">
        ${esc(label)}
        ${sub ? `<div style="margin-top:2px;font-size:12.5px;color:var(--text-secondary);font-weight:400;">${esc(sub)}</div>` : ''}
      </span>
      <input type="radio" name="${name}" value="${value}" ${checked ? 'checked' : ''} style="position:absolute;opacity:0;pointer-events:none;" />
    </label>
  `;
}

// Radio inline (Sí/No) — FIX #4 (23/05/2026): sin caja con border, solo el radio
// nativo canónico .naowee-radio (estructura del DS líneas 3875+).
function radioYN(opts) {
  const value = opts.value;
  const onYes = opts.onYes || '';
  const onNo = opts.onNo || '';
  const extra = opts.extra || [];
  const items = [
    { v:'si', t:'Sí', onClick: onYes },
    { v:'no', t:'No', onClick: onNo },
    ...extra
  ];
  return `
    <div class="naowee-radio-group naowee-radio-group--horizontal">
      ${items.map(it => {
        const selected = value === it.v;
        return `
          <label class="naowee-radio${selected ? ' naowee-radio--selected' : ''}" onclick="${it.onClick}">
            <span class="naowee-radio__circle"></span>
            <span class="naowee-radio__label">${esc(it.t)}</span>
          </label>
        `;
      }).join('')}
    </div>
  `;
}

/* ============================================================
   Stepper
   ============================================================ */
function renderStepper() {
  const wrap = document.getElementById('stepperDesktop');
  let html = '';
  STEPS.forEach((s, i) => {
    let stateCls = '';
    if (i < STATE.step) stateCls = 'naowee-stepper__step--done';
    else if (i === STATE.step) stateCls = 'naowee-stepper__step--active';

    const numberHtml = i < STATE.step
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : (i + 1);

    html += `
      <div class="naowee-stepper__step ${stateCls}" role="listitem"${i < STATE.step ? ` onclick="STATE.step=${i};render();"` : ''}>
        <span class="naowee-stepper__number">${numberHtml}</span>
        <span class="naowee-stepper__label">${esc(s.label)}</span>
      </div>
    `;
    if (i < STEPS.length - 1) {
      html += `<div class="naowee-stepper__connector${i < STATE.step ? ' naowee-stepper__connector--done' : ''}"></div>`;
    }
  });
  wrap.innerHTML = html;

  document.getElementById('stepperMobile').innerHTML = `
    Paso ${STATE.step + 1} de ${STEPS.length}
    <small>${esc(STEPS[STATE.step].label)}</small>
  `;
}

function repeatableDynamic(opts) {
  const head = opts.head;
  const cols = opts.cols;
  const rows = opts.rows;
  const cellRenderer = opts.cellRenderer;
  const onAdd = opts.onAdd;
  const onRemove = opts.onRemove;
  const minRows = opts.minRows ?? 1;
  return `
    <div class="ivc-repeatable">
      <div class="ivc-repeatable__head" style="grid-template-columns: ${cols};">
        ${head.map(h => `<div>${esc(h)}</div>`).join('')}
        <div></div>
      </div>
      ${rows.map((row, i) => `
        <div class="ivc-repeatable__row" style="grid-template-columns: ${cols};">
          ${cellRenderer(row, i)}
          <button type="button" class="naowee-btn naowee-btn--quiet naowee-btn--icon naowee-btn--small ivc-repeatable__remove"${rows.length <= minRows ? ' disabled' : ` onclick="${onRemove(i)}"`} aria-label="Eliminar fila">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      `).join('')}
      <div class="ivc-repeatable__add">
        <button type="button" class="naowee-btn naowee-btn--quiet naowee-btn--small" onclick="${onAdd}">+ Agregar fila</button>
      </div>
    </div>
  `;
}

function repeatableFixed(opts) {
  const head = opts.head;
  const cols = opts.cols;
  const rows = opts.rows;
  const cellRenderer = opts.cellRenderer;
  return `
    <div class="ivc-repeatable">
      <div class="ivc-repeatable__head" style="grid-template-columns: ${cols};">
        ${head.map(h => `<div>${esc(h)}</div>`).join('')}
      </div>
      ${rows.map((row, i) => `
        <div class="ivc-repeatable__row" style="grid-template-columns: ${cols};">
          ${cellRenderer(row, i)}
        </div>
      `).join('')}
    </div>
  `;
}

// FIX #7 (23/05/2026): genera el confetti dinámicamente en el div #confettiIvc
// tras renderizar el success step. Idempotente: solo se ejecuta si el div existe
// y está vacío.
function spawnConfetti() {
  const wrap = document.getElementById('confettiIvc');
  if (!wrap || wrap.children.length > 0) return;
  const colors = ['#FF7500', '#d74009', '#1f8923', '#1f78d1', '#ffbf75', '#fff'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + '%';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    s.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    s.style.top = '0';
    s.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
    wrap.appendChild(s);
  }
}

/* ============================================================
   Render principal
   ============================================================ */
function render() {
  renderStepper();
  const body = document.getElementById('wzBody');

  if (!isStepApplicable(STATE.step)) {
    body.innerHTML = `<div class="wz-step-panel is-active">${renderSkipView('Este paso no aplica para tu tipo de organismo.')}</div>`;
    setupFooter();
    return;
  }

  let inner = '';
  switch (STATE.step) {
    case 0: inner = renderStep0(); break;
    case 1: inner = renderStep1(); break;
    case 2: inner = renderStep2(); break;
    case 3: inner = renderStep3(); break;
    case 4: inner = renderStep4(); break;
    case 5: inner = renderStep5(); break;
    case 6: inner = renderStep6(); break;
  }
  // Cleanup popovers de datepicker huérfanos del render anterior (estaban portaled en body)
  document.querySelectorAll('body > .naowee-datepicker--popover').forEach(p => p.remove());
  // Cleanup menús de dropdown huérfanos del render anterior
  document.querySelectorAll('body > .naowee-dropdown__menu').forEach(m => m.remove());

  body.innerHTML = `<div class="wz-step-panel is-active">${inner}</div>`;

  // FIX #6: bind del datepicker canónico Naowee tras cada render (Doug 23/05/2026)
  bindDatepickers(body);

  // FIX #7 (23/05/2026): si renderizamos el success state, dispara el confetti.
  if (STATE.radicado && STATE.step === 6) {
    spawnConfetti();
  }

  setupFooter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupFooter() {
  const btnBack = document.getElementById('btnBack');
  const btnNext = document.getElementById('btnNext');

  if (STATE.radicado) {
    btnBack.style.display = 'none';
    btnNext.style.display = 'none';
    return;
  }
  btnBack.style.display = '';
  btnNext.style.display = '';

  btnBack.style.visibility = STATE.step === 0 ? 'hidden' : 'visible';

  if (STATE.step === 6) {
    btnNext.innerHTML = 'Radicar trámite';
    btnNext.disabled = !STATE.data.aceptaRadicacion;
  } else if (STATE.step === 0) {
    btnNext.textContent = 'Continuar →';
    btnNext.disabled = !(STATE.tipoOrganismo && STATE.tipoTramite);
  } else {
    btnNext.textContent = 'Continuar →';
    btnNext.disabled = false;
  }
}

/* ============================================================
   Validación con shake canónico .naowee-shake
   ============================================================ */
function validateStep1() {
  const errors = [];
  const required = [
    { key:'nombre',    sel:'#f-nombre' },
    { key:'nit',       sel:'#f-nit' },
    { key:'telefono',  sel:'#f-tel' },
    { key:'direccion', sel:'#f-dir' },
    { key:'municipio', sel:'#f-mun' },
    { key:'correo',    sel:'#f-correo' }
  ];
  required.forEach(r => {
    if (!String(STATE.data[r.key] || '').trim()) errors.push(r);
  });
  const correo = String(STATE.data.correo || '').trim();
  if (correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) errors.push({ key:'correo', sel:'#f-correo' });
  return errors;
}

function shakeFields(errors) {
  errors.forEach(e => {
    if (!e.sel) return;
    const el = document.querySelector(e.sel);
    if (!el) return;
    // Caso A: el target está dentro de un .naowee-dropdown (componente canónico DS)
    const ddRoot = el.closest('.naowee-dropdown');
    if (ddRoot) {
      ddRoot.classList.add('naowee-dropdown--error', 'naowee-shake');
      setTimeout(() => ddRoot.classList.remove('naowee-shake'), 500);
      if (!ddRoot.querySelector('.naowee-helper--negative')) {
        const helper = document.createElement('div');
        helper.className = 'naowee-helper naowee-helper--negative';
        helper.style.marginTop = '6px';
        helper.innerHTML = `
          <span class="naowee-helper__badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
          <span class="naowee-helper__text">Este campo es obligatorio</span>
        `;
        ddRoot.appendChild(helper);
      }
      return;
    }
    // Caso B: el target está dentro de un .naowee-textfield
    const wrap = el.closest('.naowee-textfield__input-wrap');
    if (wrap) {
      wrap.classList.add('naowee-shake');
      setTimeout(() => wrap.classList.remove('naowee-shake'), 500);
    }
    const tfRoot = el.closest('.naowee-textfield');
    if (tfRoot) {
      tfRoot.classList.add('naowee-textfield--error');
      // Insertar helper de error si no existe
      if (!tfRoot.querySelector('.naowee-helper--negative')) {
        const helper = document.createElement('div');
        helper.className = 'naowee-helper naowee-helper--negative';
        helper.style.marginTop = '6px';
        helper.innerHTML = `
          <span class="naowee-helper__badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
          <span class="naowee-helper__text">Este campo es obligatorio</span>
        `;
        tfRoot.appendChild(helper);
      }
    }
  });
}

/* ============================================================
   Navegación
   ============================================================ */
function next() {
  if (STATE.step === 0) {
    if (!STATE.tipoOrganismo || !STATE.tipoTramite) {
      alert('Selecciona tipo de organismo y trámite para continuar.');
      return;
    }
  }
  if (STATE.step === 1) {
    const errs = validateStep1();
    if (errs.length) { shakeFields(errs); return; }
  }

  if (STATE.step === 6) {
    STATE.radicado = 'IVC-2026-' + String(Math.floor(10000 + Math.random() * 89999));
    render();
    return;
  }

  let nextStep = STATE.step + 1;
  while (nextStep <= 6 && !isStepApplicable(nextStep)) nextStep++;
  STATE.step = Math.min(nextStep, 6);
  render();
}

function prev() {
  let prevStep = STATE.step - 1;
  while (prevStep >= 0 && !isStepApplicable(prevStep)) prevStep--;
  STATE.step = Math.max(prevStep, 0);
  render();
}

document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnBack').addEventListener('click', prev);

/* ============================================================
   Controlador del componente canónico .naowee-dropdown
   (event delegation — sobrevive re-renders)

   FIX #2/#5 (Doug 23/05/2026): patrón portal — el __menu se mueve
   al <body> en open() y se posiciona con coords fixed calculadas
   desde el rect del trigger. Esto escapa cualquier overflow:hidden
   de containers padres (wz-card, wz-body, ivc-repeatable, etc.).
   Mismo patrón que usa el datepicker del Project v2.0.3.
   ============================================================ */
(function setupNaoweeDropdownController(){
  // Asegurar dd-id único para que el menú portaled pueda volver a su dropdown origen
  function ensureDdId(wrap){
    if (wrap.dataset.ddId) return wrap.dataset.ddId;
    const id = 'dd-portal-' + Math.random().toString(36).slice(2,9);
    wrap.dataset.ddId = id;
    return id;
  }

  function getMenu(wrap){
    const id = ensureDdId(wrap);
    // Buscar primero como hijo del wrap, después en body (si ya fue portaled)
    return wrap.querySelector(':scope > .naowee-dropdown__menu')
        || document.querySelector(`body > .naowee-dropdown__menu[data-owned-by="${id}"]`);
  }

  function positionMenu(wrap, menu){
    const trg = wrap.querySelector('.naowee-dropdown__trigger');
    if (!trg) return;
    const rect = trg.getBoundingClientRect();
    const margin = 8;
    const menuH = menu.offsetHeight || 240;
    const menuW = rect.width;
    const spaceBelow = window.innerHeight - rect.bottom - margin;
    let top;
    // Flip-up cuando no cabe debajo
    if (spaceBelow >= menuH + 6 || spaceBelow >= rect.top - margin) {
      top = rect.bottom + 6;
      if (top + menuH > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - margin - menuH);
      }
    } else {
      top = rect.top - menuH - 6;
      if (top < margin) top = margin;
    }
    menu.style.position = 'fixed';
    menu.style.top = top + 'px';
    menu.style.left = rect.left + 'px';
    menu.style.width = rect.width + 'px';
    menu.style.zIndex = '9999';
  }

  function portalToBody(wrap){
    const id = ensureDdId(wrap);
    let menu = wrap.querySelector(':scope > .naowee-dropdown__menu');
    if (menu) {
      menu.dataset.ownedBy = id;
      document.body.appendChild(menu);
    } else {
      menu = document.querySelector(`body > .naowee-dropdown__menu[data-owned-by="${id}"]`);
    }
    return menu;
  }

  function openDropdown(wrap){
    closeAll(wrap);
    const menu = portalToBody(wrap);
    if (!menu) return;
    wrap.classList.add('naowee-dropdown--open');
    // El __menu portaled necesita la clase del padre para que opacity/pointer-events
    // del DS (.naowee-dropdown--open .naowee-dropdown__menu) se apliquen.
    // Como ahora está en body sin padre .naowee-dropdown--open, replicamos los estilos
    // necesarios inline. Doug 23/05/2026.
    menu.style.opacity = '1';
    menu.style.pointerEvents = 'auto';
    menu.style.visibility = 'visible';
    menu.style.transform = 'translateY(0)';
    menu.style.maxHeight = '260px';
    menu.style.overflowY = 'auto';
    positionMenu(wrap, menu);
    const trg = wrap.querySelector('.naowee-dropdown__trigger');
    if (trg) trg.setAttribute('aria-expanded', 'true');
  }

  function closeDropdown(wrap){
    wrap.classList.remove('naowee-dropdown--open');
    const id = wrap.dataset.ddId;
    if (id) {
      const menu = document.querySelector(`body > .naowee-dropdown__menu[data-owned-by="${id}"]`);
      if (menu) {
        menu.style.opacity = '0';
        menu.style.pointerEvents = 'none';
        menu.style.visibility = 'hidden';
      }
    }
    const trg = wrap.querySelector('.naowee-dropdown__trigger');
    if (trg) trg.setAttribute('aria-expanded', 'false');
  }

  function closeAll(except){
    document.querySelectorAll('.naowee-dropdown.naowee-dropdown--open').forEach(d => {
      if (d === except) return;
      closeDropdown(d);
    });
  }

  // Re-posicionar todos los menús abiertos en scroll/resize (cierre suave: los
  // menús flotantes en HTML5 selects también se cierran en scroll).
  let scrollCloseScheduled = false;
  function onScrollOrResize(){
    if (scrollCloseScheduled) return;
    scrollCloseScheduled = true;
    requestAnimationFrame(() => {
      scrollCloseScheduled = false;
      closeAll(null);
    });
  }
  window.addEventListener('scroll', onScrollOrResize, true);
  window.addEventListener('resize', onScrollOrResize);

  function runOnChange(wrap, value, text){
    const onChange = wrap.getAttribute('data-on-change') || '';
    if (onChange) {
      try {
        // Los handlers son strings tipo "STATE.x=this.value". Reemplazamos
        // this.value por una referencia literal al valor seleccionado y eval-uamos.
        const literal = JSON.stringify(String(value));
        const code = onChange.replace(/this\.value/g, literal);
        // eslint-disable-next-line no-new-func
        new Function(code)();
      } catch(err) {
        console.error('[naowee-dropdown] onChange error:', err, onChange);
      }
    }
    // CustomEvent para listeners externos
    wrap.dispatchEvent(new CustomEvent('change', { detail:{ value, text }, bubbles:true }));
  }

  // Resolver el wrap origen desde una opción (puede estar en el menú portaled en body)
  function resolveWrap(option){
    // Caso A: opción todavía dentro del .naowee-dropdown original
    const direct = option.closest('.naowee-dropdown');
    if (direct) return direct;
    // Caso B: opción dentro de un .naowee-dropdown__menu portaled en body
    const menu = option.closest('.naowee-dropdown__menu');
    if (menu && menu.dataset.ownedBy) {
      return document.querySelector(`.naowee-dropdown[data-dd-id="${menu.dataset.ownedBy}"]`);
    }
    return null;
  }

  // Click delegado
  document.addEventListener('click', function(ev){
    const trigger = ev.target.closest('.naowee-dropdown__trigger');
    const option  = ev.target.closest('.naowee-dropdown__option');

    // Click en una opción
    if (option) {
      const wrap = resolveWrap(option);
      if (!wrap) return;
      // Si la opción está deshabilitada, no hacer nada (no cerrar, no disparar onChange)
      if (option.classList.contains('naowee-dropdown__option--disabled') || option.getAttribute('aria-disabled') === 'true') {
        ev.stopPropagation();
        return;
      }
      const value = option.getAttribute('data-value') || '';
      const text  = option.textContent.trim();
      // marca seleccionada — busca opciones tanto en el wrap original como en el menú portaled
      const menu = option.closest('.naowee-dropdown__menu');
      const scope = menu || wrap;
      scope.querySelectorAll('.naowee-dropdown__option--selected')
          .forEach(o => o.classList.remove('naowee-dropdown__option--selected'));
      option.classList.add('naowee-dropdown__option--selected');
      // actualiza trigger
      const trg = wrap.querySelector('.naowee-dropdown__trigger');
      const labelSpan = trg.querySelector('.naowee-dropdown__placeholder, .naowee-dropdown__value');
      if (labelSpan) {
        labelSpan.className = 'naowee-dropdown__value';
        labelSpan.textContent = text;
      }
      // limpia error si lo tenía
      wrap.classList.remove('naowee-dropdown--error');
      const helper = wrap.querySelector('.naowee-helper--negative');
      if (helper) helper.remove();
      // cierra (cierra correctamente el menú portaled)
      closeDropdown(wrap);
      // dispara onChange
      runOnChange(wrap, value, text);
      ev.stopPropagation();
      return;
    }

    // Click en el trigger → toggle
    if (trigger) {
      const wrap = trigger.closest('.naowee-dropdown');
      if (!wrap) return;
      if (wrap.classList.contains('naowee-dropdown--disabled')) return;
      const wasOpen = wrap.classList.contains('naowee-dropdown--open');
      if (wasOpen) {
        closeDropdown(wrap);
      } else {
        openDropdown(wrap);
      }
      ev.stopPropagation();
      return;
    }

    // Click fuera → cierra todos (excepto si el click cayó dentro de un menú portaled)
    if (ev.target.closest('.naowee-dropdown__menu')) return;
    closeAll(null);
  });

  // Resolver el wrap activo desde el elemento enfocado (puede estar en menú portaled)
  function resolveActiveWrap(){
    const ae = document.activeElement;
    if (!ae || !ae.closest) return null;
    // a) Foco dentro del .naowee-dropdown original (trigger o legado)
    const direct = ae.closest('.naowee-dropdown');
    if (direct) return direct;
    // b) Foco dentro de un menú portaled en body
    const menu = ae.closest('.naowee-dropdown__menu');
    if (menu && menu.dataset.ownedBy) {
      return document.querySelector(`.naowee-dropdown[data-dd-id="${menu.dataset.ownedBy}"]`);
    }
    return null;
  }

  function getOptionsForWrap(wrap){
    // Buscar opciones primero en el menú portaled, fallback al wrap original
    const id = wrap.dataset.ddId;
    if (id) {
      const menu = document.querySelector(`body > .naowee-dropdown__menu[data-owned-by="${id}"]`);
      if (menu) return Array.from(menu.querySelectorAll('.naowee-dropdown__option:not(.naowee-dropdown__option--disabled)'));
    }
    return Array.from(wrap.querySelectorAll('.naowee-dropdown__option:not(.naowee-dropdown__option--disabled)'));
  }

  // Teclado
  document.addEventListener('keydown', function(ev){
    const wrap = resolveActiveWrap();
    if (!wrap) {
      if (ev.key === 'Escape') closeAll(null);
      return;
    }
    const isOpen = wrap.classList.contains('naowee-dropdown--open');
    const trg = wrap.querySelector('.naowee-dropdown__trigger');
    const options = getOptionsForWrap(wrap);

    if (ev.key === 'Escape') {
      closeDropdown(wrap);
      if (trg) trg.focus();
      ev.preventDefault();
      return;
    }
    if ((ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown') && !isOpen && document.activeElement === trg) {
      openDropdown(wrap);
      if (options[0]) options[0].focus();
      ev.preventDefault();
      return;
    }
    if (isOpen && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      const focused = document.activeElement.closest('.naowee-dropdown__option');
      const idx = focused ? options.indexOf(focused) : -1;
      const next = ev.key === 'ArrowDown' ? Math.min(options.length - 1, idx + 1) : Math.max(0, idx - 1);
      if (options[next]) options[next].focus();
      ev.preventDefault();
      return;
    }
    if (isOpen && ev.key === 'Enter') {
      const focused = document.activeElement.closest('.naowee-dropdown__option');
      if (focused) { focused.click(); ev.preventDefault(); }
      return;
    }
  });
})();

render();

/* ═══════════════════════════════════════════════════════════════════════
   v1.4.8 (2026-05-23): Pill de versionamiento (inline porque este demo
   es standalone, no usa shared/). Patrón canónico: clase .ivc-version-pill

(function mountIvcVersionPill(){
  var IVC_VERSION = 'v1.4.8';
  var RELEASE_URL = 'https://github.com/naowee-tech/naowee-ivc/releases/tag/ivc-' + IVC_VERSION;
  if (document.getElementById('ivcVersionPill')) return;
  /* Inyectar el CSS del pill inline (este demo no carga shared/version-pill.css) */
  var style = document.createElement('style');
  style.textContent =
    '.ivc-version-pill{position:fixed;right:18px;bottom:18px;z-index:998;' +
    'font-family:"Inter",sans-serif;font-feature-settings:"tnum";pointer-events:none}' +
    '.ivc-version-pill__btn{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;' +
    'padding:6px 12px;background:#fff;border:1px solid #e7e9f3;border-radius:9999px;' +
    'text-decoration:none;color:#646587;font-size:11.5px;font-weight:500;' +
    'box-shadow:0 2px 8px rgba(20,20,40,.06),0 1px 2px rgba(20,20,40,.04);' +
    'transition:border-color .15s,color .15s,box-shadow .15s,transform .12s;cursor:pointer}' +
    '.ivc-version-pill__btn:hover,.ivc-version-pill__btn:focus-visible{border-color:#ffbf75;' +
    'color:#d74009;box-shadow:0 4px 12px rgba(215,64,9,.15),0 1px 3px rgba(215,64,9,.08);' +
    'outline:none;transform:translateY(-1px)}' +
    '.ivc-version-pill__brand{letter-spacing:.3px;font-weight:600;color:inherit}' +
    '.ivc-version-pill__num{font-weight:700;color:#d74009;font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:11px}' +
    '.ivc-version-pill__btn:hover .ivc-version-pill__num{color:#b8350a}' +
    '@media(max-width:640px){.ivc-version-pill{right:12px;bottom:12px}' +
    '.ivc-version-pill__btn{padding:5px 10px;font-size:10.5px}.ivc-version-pill__num{font-size:10.5px}}' +
    '@media print{.ivc-version-pill{display:none}}';
  document.head.appendChild(style);
  var wrap = document.createElement('div');
  wrap.id = 'ivcVersionPill';
  wrap.className = 'ivc-version-pill';
  wrap.dataset.version = IVC_VERSION;
  wrap.innerHTML =
    '<a class="ivc-version-pill__btn" href="' + RELEASE_URL + '" target="_blank" rel="noopener" ' +
       'title="Naowee IVC — Ver release notes en GitHub" ' +
       'aria-label="Versión del prototipo: ' + IVC_VERSION + '">' +
      '<span class="ivc-version-pill__brand">IVC</span>' +
      '<strong class="ivc-version-pill__num">' + IVC_VERSION + '</strong>' +
    '</a>';
  document.body.appendChild(wrap);
})();
</script>
